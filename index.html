<html lang="en">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    .tag { display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 100px; letter-spacing: 0.03em; }

    .undo-toast { position: fixed; bottom: calc(124px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: #1e1e1e; border: 1px solid #333; border-radius: 10px; padding: 9px 9px 9px 16px; font-size: 12px; z-index: 998; animation: toastIn 0.25s ease; display: flex; align-items: center; gap: 10px; white-space: nowrap; }

      /* Taller import zone for thumb use */

<body>
<div id="root"></div>
<script type="text/babel">

const { useState, useMemo, useEffect, useRef } = React;

// ── Default Taxonomy ──────────────────────────────────────────────────────────
const DEFAULT_TAXONOMY = [
  { category:"Groceries",         subcategory:"Groceries",         type:"expense",     budget:0 },
  { category:"Utilities",         subcategory:"Phone Bill",        type:"expense",     budget:0 },
  { category:"Utilities",         subcategory:"Internet Bill",     type:"expense",     budget:0 },
  { category:"Entertainment",     subcategory:"Movies",            type:"expense",     budget:0 },
  { category:"Work",              subcategory:"Paycheque",         type:"income",      budget:0 },
  { category:"Not Assigned",      subcategory:"Not Assigned",      type:"expense",     budget:0 },
  { category:"Not Assigned",      subcategory:"Not Assigned",      type:"income",      budget:0 },
  { category:"Not Assigned",      subcategory:"Not Assigned",      type:"notreported", budget:0 },
];

// ── Default Rules ─────────────────────────────────────────────────────────────
const DEFAULT_DESC_RULES = [];

// ── Helpers ───────────────────────────────────────────────────────────────────
function computeExpenseCats(taxonomy) {
  // Preserve first-seen category order (matching Edit view), include only categories
  // that have at least one non-income entry.
  const order = [], orderSet = new Set(), qualified = new Set();
  taxonomy.forEach(t => {
    if (!orderSet.has(t.category)) { orderSet.add(t.category); order.push(t.category); }
    if (t.type !== "income") qualified.add(t.category);
  });
  return order.filter(c => qualified.has(c));
}
function computeIncomeCats(taxonomy) {
  // Preserve first-seen category order (matching Edit view), include only categories
  // that have at least one non-expense entry.
  const order = [], orderSet = new Set(), qualified = new Set();
  taxonomy.forEach(t => {
    if (!orderSet.has(t.category)) { orderSet.add(t.category); order.push(t.category); }
    if (t.type !== "expense") qualified.add(t.category);
  });
  return order.filter(c => qualified.has(c));
}
function getSubcats(taxonomy, cat, tf) {
  const seen = {}, out = [];
  taxonomy.forEach(t => {
    if (t.category === cat && !seen[t.subcategory]) {
      const match = tf === "notreported" ? t.type === "notreported" : (t.type === tf || t.type === "notreported");
      if (match) { seen[t.subcategory] = 1; out.push(t.subcategory); }
    }
  });
  return out;
}
function getTaxonomyEntry(taxonomy, cat, sub, preferredType) {
  const matches = taxonomy.filter(t => t.category === cat && t.subcategory === sub);
  if (!matches.length) return {};
  if (preferredType) {
    const typed = matches.find(t => t.type === preferredType);
    if (typed) return typed;
  }
  return matches[0];
}

// ── matchDesc: type:"auto" resolves to income/expense based on amount sign ────
function matchDesc(rules, desc, amountSign) {
  for (const r of rules) {
    try {
      if (new RegExp(r.pattern, "i").test(desc)) {
        const resolvedType = r.type === "auto"
          ? (amountSign >= 0 ? "income" : "expense")
          : r.type;
        return { category: r.category, subcategory: r.subcategory, type: resolvedType, nickname: r.nickname||"", matched: true };
      }
    } catch(e) {}
  }
  return amountSign >= 0
    ? { category:"Not Assigned", subcategory:"Not Assigned", type:"income",  nickname:"", matched:false }
    : { category:"Not Assigned", subcategory:"Not Assigned", type:"expense", nickname:"", matched:false };
}

function parseDate(raw) {
  if (raw == null || raw === "") return new Date().toISOString().split("T")[0];
  if (raw instanceof Date) return isNaN(raw.getTime()) ? new Date().toISOString().split("T")[0] : raw.toISOString().split("T")[0];
  if (typeof raw === "number" && raw >= 19000101 && raw <= 21001231) {
    const s = String(Math.floor(raw));
    if (s.length === 8) { const d = new Date(s.slice(0,4)+"-"+s.slice(4,6)+"-"+s.slice(6,8)); if (!isNaN(d.getTime())) return d.toISOString().split("T")[0]; }
  }
  if (typeof raw === "number") { const d = new Date(Date.UTC(1899,11,30)+raw*86400000); return isNaN(d.getTime())?new Date().toISOString().split("T")[0]:d.toISOString().split("T")[0]; }
  const str = String(raw).trim();
  if (/^\d{8}$/.test(str)) { const d = new Date(str.slice(0,4)+"-"+str.slice(4,6)+"-"+str.slice(6,8)); if (!isNaN(d.getTime())) return d.toISOString().split("T")[0]; }
  const d = new Date(str);
  return isNaN(d.getTime()) ? new Date().toISOString().split("T")[0] : d.toISOString().split("T")[0];
}

const PALETTE = ["#f97316","#3b82f6","#8b5cf6","#eab308","#ec4899","#10b981","#f43f5e","#06b6d4","#84cc16","#f59e0b","#a78bfa","#34d399","#fb923c","#60a5fa","#e879f9"];
function catColor(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) { h = str.charCodeAt(i) + ((h << 5) - h); h |= 0; }
  return PALETTE[Math.abs(h) % PALETTE.length];
}

function calcStats(txList) {
  let income = 0, expenses = 0;
  const byCat = {}, byIncomeCat = {};
  txList.forEach(t => {
    if (t.type === "income") {
      income += t.amount;
      if (!byIncomeCat[t.category]) byIncomeCat[t.category] = { total:0, subs:{} };
      byIncomeCat[t.category].total += t.amount;
      const sub = t.subcategory||"—";
      byIncomeCat[t.category].subs[sub] = (byIncomeCat[t.category].subs[sub]||0) + t.amount;
    }
    if (t.type === "expense") {
      expenses += Math.abs(t.amount);
      if (!byCat[t.category]) byCat[t.category] = { total:0, subs:{} };
      byCat[t.category].total += Math.abs(t.amount);
      const sub = t.subcategory||"—";
      byCat[t.category].subs[sub] = (byCat[t.category].subs[sub]||0) + Math.abs(t.amount);
    }
  });
  return { income, expenses, balance:income-expenses, byCat, byIncomeCat };
}

function isSafePattern(pattern) {
  if (!pattern || pattern.length > 200) return false;
  if (/\(.*?[+*].*?\)[+*{]/.test(pattern)) return false;
  try { new RegExp(pattern, "i"); return true; } catch(e) { return false; }
}

function generatePatternSuggestions(rawDesc) {
  const desc = rawDesc.trim();
  function esc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  const exact = esc(desc);
  const medium = esc(desc.replace(/\s*#\d[\d\-]*.*$/, '').replace(/\s+\d{4,}.*$/, '').replace(/\s+[A-Z]{2}$/, '').trim());
  const words = desc.trim().split(/\s+/);
  const broadWords = [];
  for (const w of words) {
    if (/^[\d#]/.test(w)) break;
    broadWords.push(esc(w));
    if (broadWords.length >= 2) break;
  }
  const broad = broadWords.join(' ');
  const seen = new Set(), out = [];
  for (const [label, pat] of [['Broad', broad], ['Medium', medium], ['Exact', exact]]) {
    if (pat && pat.length > 0 && !seen.has(pat)) { seen.add(pat); out.push({ label, pattern: pat }); }
  }
  return out;
}

// ── UI constants ──────────────────────────────────────────────────────────────
// "auto" is a rule-level type only — transactions are always income/expense/notreported
const TYPE_STYLE = {
  expense:     { bg:"#f43f5e18", color:"#f43f5e" },
  income:      { bg:"#10b98118", color:"#10b981" },
  notreported: { bg:"#6b728018", color:"#9ca3af" },
  auto:        { bg:"#3b82f618", color:"#3b82f6" },
};
const TYPE_LABEL = { expense:"Expense", income:"Income", notreported:"Not Reported", auto:"Auto (by sign)" };

// Rule type options — "auto" is the default; explicit overrides still available
const RULE_TYPES = [
  { value:"auto",        label:"Auto",         hint:"income if +, expense if −" },
  { value:"notreported", label:"Not Reported",  hint:"always excluded from totals" },
  { value:"income",      label:"Force Income",  hint:"always income regardless of sign" },
  { value:"expense",     label:"Force Expense", hint:"always expense regardless of sign" },
];

const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const STORAGE_KEY = "budget-tracker-v2", TAXONOMY_KEY = "budget-tracker-taxonomy", RULES_KEY = "budget-tracker-rules", ACCOUNTS_KEY = "budget-tracker-accounts", ROLLOVER_KEY = "budget-tracker-rollover", ROLLOVER_MODE_KEY = "budget-tracker-rollover-mode", ROLLOVER_SUBS_KEY = "budget-tracker-rollover-subs";
const ACCOUNT_TYPE_META = {
  chequing: { label:"Chequing",    icon:"🏦", color:"#3b82f6", hint:"Debits are expenses, credits are income" },
  savings:  { label:"Savings",     icon:"🪙", color:"#10b981", hint:"Same sign convention as chequing" },
  credit:   { label:"Credit Card", icon:"💳", color:"#f43f5e", hint:"All charges are treated as expenses" },
};
const fmt = n => new Intl.NumberFormat("en-CA",{style:"currency",currency:"CAD"}).format(n||0);
const SEED_BASE = 1_000_000;
const SEED = [
  { id:SEED_BASE+1, description:"Safeway",        amount:-112.4, category:"Groceries",    subcategory:"Groceries",    type:"expense", date:"2026-02-28" },
  { id:SEED_BASE+2, description:"Netflix",        amount:-18.0,  category:"Entertainment",subcategory:"Movies",        type:"expense", date:"2026-02-25" },
  { id:SEED_BASE+3, description:"Rogers",         amount:-85.0,  category:"Utilities",    subcategory:"Phone Bill",   type:"expense", date:"2026-02-24" },
  { id:SEED_BASE+4, description:"Shaw Internet",  amount:-59.75, category:"Utilities",    subcategory:"Internet Bill",type:"expense", date:"2026-02-01" },
  { id:SEED_BASE+5, description:"Whole Foods",    amount:-62.5,  category:"Groceries",    subcategory:"Groceries",    type:"expense", date:"2026-03-01" },
];
const BLANK      = { description:"", amount:"", typeFilter:"expense", category:"", subcategory:"", date:new Date().toISOString().split("T")[0], note:"", accountId:null };
const BLANK_TAX  = { category:"", subcategory:"", type:"expense", budget:0 };
// Default rule type is now "auto"
const BLANK_RULE = { pattern:"", category:"", subcategory:"", type:"auto", nickname:"" };

// ── ConfirmModal ──────────────────────────────────────────────────────────────
function ConfirmModal({ message, detail, confirmLabel="Confirm", danger=false, onConfirm, onCancel }) {
  return (
    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onCancel();}}>
      <div className="modal-box" style={{background:"#181818",border:"1px solid #2e2e2e",borderRadius:16,width:"100%",maxWidth:420,padding:"28px 28px 24px",boxShadow:"0 24px 64px rgba(0,0,0,0.7)"}}>
        <div style={{fontSize:14,color:"#ddd",marginBottom:detail?10:24,fontWeight:500,lineHeight:1.5}}>{message}</div>
        {detail && <div style={{fontSize:12,color:"#888888",marginBottom:24,lineHeight:1.7,borderLeft:"2px solid #2a2a2a",paddingLeft:12}}>{detail}</div>}
        <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
          <button className="btn btn-secondary" onClick={onCancel}>Cancel</button>
          <button className="btn btn-primary" style={danger?{background:"#f43f5e",color:"#fff"}:{}} onClick={onConfirm}>{confirmLabel}</button>
        </div>
      </div>
    </div>
  );
}

// ── RuleTypeSelector — shared across rule forms ───────────────────────────────
function RuleTypeSelector({ value, onChange, size="normal" }) {
  const isSmall = size === "small";
  return (
    <div style={{display:"flex",flexDirection:"column",gap:5}}>
      {RULE_TYPES.map(rt => {
        const active = value === rt.value;
        const ts = TYPE_STYLE[rt.value] || TYPE_STYLE.auto;
        return (
          <label key={rt.value} style={{display:"flex",alignItems:"center",gap:10,cursor:"pointer",padding:isSmall?"5px 8px":"7px 10px",borderRadius:7,border:"1px solid "+(active?ts.color+"55":"#1e1e1e"),background:active?ts.bg:"transparent",transition:"all 0.15s"}} onClick={()=>onChange(rt.value)}>
            <div style={{width:12,height:12,borderRadius:"50%",border:"1px solid "+(active?ts.color:"#5a5a5a"),background:active?ts.color:"transparent",flexShrink:0,transition:"all 0.15s"}}/>
            <div style={{flex:1}}>
              <span style={{fontSize:isSmall?11:12,color:active?ts.color:"#999999",fontWeight:active?500:400}}>{rt.label}</span>
              {!isSmall && <span style={{fontSize:10,color:"#5a5a5a",marginLeft:8}}>{rt.hint}</span>}
            </div>
          </label>
        );
      })}
    </div>
  );
}

// ── CreateRuleModal ───────────────────────────────────────────────────────────
function CreateRuleModal({ tx, taxonomy, onSave, onCancel }) {
  const expenseCats = useMemo(() => computeExpenseCats(taxonomy), [taxonomy]);
  const incomeCats  = useMemo(() => computeIncomeCats(taxonomy),  [taxonomy]);
  const suggestions = useMemo(() => generatePatternSuggestions(tx.description), [tx.description]);

  const [patternIdx,    setPatternIdx]    = useState(0);
  const [useCustom,     setUseCustom]     = useState(false);
  const [customPattern, setCustomPattern] = useState("");
  const [ruleType,      setRuleType]      = useState("auto");
  const [category,      setCategory]      = useState(tx.category);
  const [subcategory,   setSubcategory]   = useState(tx.subcategory);
  const [nickname,      setNickname]      = useState(tx.nickname||"");
  const [patternError,  setPatternError]  = useState("");

  const pattern  = useCustom ? customPattern : (suggestions[patternIdx]?.pattern || "");
  // For category dropdowns we show all cats since type is dynamic for "auto"
  const cats     = ruleType === "income" ? incomeCats : expenseCats;
  const subcats  = category ? getSubcats(taxonomy, category, ruleType === "auto" ? "expense" : ruleType) : [];
  const canSave  = pattern && category && subcategory;
  const tsPreview = TYPE_STYLE[ruleType] || TYPE_STYLE.auto;

  function handleCatChange(cat) {
    setCategory(cat);
    setSubcategory(getSubcats(taxonomy, cat, ruleType === "auto" ? "expense" : ruleType)[0] || "");
  }

  function handleSave() {
    setPatternError("");
    const p = pattern.trim();
    if (!p) { setPatternError("A pattern is required."); return; }
    if (!isSafePattern(p)) { setPatternError("Invalid or unsafe pattern. Check for syntax errors or nested quantifiers."); return; }
    if (!category || !subcategory) return;
    onSave({ pattern: p, category, subcategory, type: ruleType, nickname: nickname.trim() });
  }

  return (
    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onCancel();}}>
      <div className="modal-box" style={{background:"#181818",border:"1px solid #2e2e2e",borderRadius:16,width:"100%",maxWidth:540,boxShadow:"0 24px 64px rgba(0,0,0,0.7)",maxHeight:"90vh",overflowY:"auto"}}>
        <div style={{padding:"18px 22px 14px",borderBottom:"1px solid #222",display:"flex",justifyContent:"space-between",alignItems:"flex-start",position:"sticky",top:0,background:"#181818",zIndex:1}}>
          <div>
            <div style={{fontSize:10,letterSpacing:"0.2em",color:"#737373",textTransform:"uppercase",marginBottom:4}}>Create Match Rule</div>
            <div style={{fontSize:12,color:"#888888"}}>from: <span style={{color:"#bbbbbb"}}>{tx.description}</span></div>
          </div>
          <button className="btn-danger" style={{fontSize:20,padding:"4px 10px"}} onClick={onCancel}>×</button>
        </div>

        <div style={{padding:"18px 22px",display:"grid",gap:18}}>
          {/* Pattern */}
          <div>
            <div style={{fontSize:9,letterSpacing:"0.15em",color:"#737373",textTransform:"uppercase",marginBottom:10}}>
              Match Pattern
              <span style={{color:"#555555",marginLeft:8,letterSpacing:"0.05em",textTransform:"none",fontSize:10}}>— how specifically should this rule match?</span>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:7}}>
              {suggestions.map((s,i) => (
                <div key={i} className={"pattern-option"+(!useCustom&&patternIdx===i?" selected":"")} onClick={()=>{setPatternIdx(i);setUseCustom(false);setPatternError("");}}>
                  <div className={"radio-dot"+(!useCustom&&patternIdx===i?" selected":"")}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:9,color:"#888888",letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:4}}>{s.label}</div>
                    <code style={{fontSize:12,color:"#8b5cf6",wordBreak:"break-all",display:"block"}}>{s.pattern}</code>
                  </div>
                </div>
              ))}
              <div className={"pattern-option"+(useCustom?" selected":"")} onClick={()=>{setUseCustom(true);setPatternError("");}}>
                <div className={"radio-dot"+(useCustom?" selected":"")}/>
                <div style={{flex:1}}>
                  <div style={{fontSize:9,color:"#888888",letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:6}}>Custom</div>
                  <input className={"input-sm"+(patternError?" input-error":"")} placeholder="Enter custom regex pattern…" value={customPattern} maxLength={200} onClick={e=>e.stopPropagation()} onChange={e=>{setCustomPattern(e.target.value);setPatternError("");}} style={{fontFamily:"monospace",color:"#8b5cf6",width:"100%"}}/>
                </div>
              </div>
              {patternError && <div style={{fontSize:11,color:"#f43f5e",padding:"0 4px"}}>{patternError}</div>}
            </div>
          </div>

          {/* Rule Type */}
          <div>
            <div style={{fontSize:9,letterSpacing:"0.15em",color:"#737373",textTransform:"uppercase",marginBottom:10}}>Classification</div>
            <RuleTypeSelector value={ruleType} onChange={v=>{setRuleType(v);setCategory("");setSubcategory("");}}/>
          </div>

          {/* Category + Subcategory */}
          <div className="grid-2">
            <div>
              <div style={{fontSize:9,letterSpacing:"0.12em",color:"#737373",textTransform:"uppercase",marginBottom:6}}>Category</div>
              <select className="input" value={category} onChange={e=>handleCatChange(e.target.value)}>
                <option value="">— Select —</option>
                {cats.map(c=><option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            <div>
              <div style={{fontSize:9,letterSpacing:"0.12em",color:"#737373",textTransform:"uppercase",marginBottom:6}}>Subcategory</div>
              <select className="input" value={subcategory} disabled={!category} onChange={e=>setSubcategory(e.target.value)}>
                <option value="">— Select —</option>
                {subcats.map(s=><option key={s} value={s}>{s}</option>)}
              </select>
            </div>
          </div>

          {/* Nickname */}
          <div>
            <div style={{fontSize:9,letterSpacing:"0.15em",color:"#737373",textTransform:"uppercase",marginBottom:6}}>
              Nickname
              <span style={{color:"#555555",marginLeft:8,letterSpacing:"0.05em",textTransform:"none",fontSize:10}}>— optional display name applied to every matched transaction</span>
            </div>
            <input className="input" placeholder={`e.g. "${tx.description.split(/\s+/).slice(0,2).join(" ")}" → cleaner name`} value={nickname} onChange={e=>setNickname(e.target.value)} maxLength={100}/>
            {nickname.trim()&&<div style={{fontSize:10,color:"#737373",marginTop:5}}>Transactions will show <span style={{color:"#ccc"}}>{nickname.trim()}</span> with the original bank description shown below in smaller text.</div>}
          </div>

          {/* Preview */}
          {canSave && (
            <div style={{padding:"10px 14px",background:"#0f0f0f",borderRadius:8,border:"1px solid #1e1e1e"}}>
              <div style={{fontSize:9,color:"#5a5a5a",letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:6}}>Rule Preview</div>
              <div style={{fontSize:11,color:"#888888",lineHeight:2}}>
                When description matches{" "}
                <code style={{color:"#8b5cf6",background:"#1a1a1a",padding:"1px 6px",borderRadius:4}}>{pattern}</code>
                {" → "}
                <span style={{color:catColor(category)}}>{category}</span>
                <span style={{color:"#5a5a5a"}}> / </span>
                <span style={{color:"#999999"}}>{subcategory}</span>
                <span style={{marginLeft:8}}><span className="tag" style={{background:tsPreview.bg,color:tsPreview.color}}>{TYPE_LABEL[ruleType]}</span></span>
                {nickname.trim()&&<><br/>Display as <span style={{color:"#e8e0d5",fontWeight:500}}>{nickname.trim()}</span></>}
              </div>
            </div>
          )}

          <div style={{display:"flex",gap:10}}>
            <button className="btn btn-primary" style={{flex:1,padding:12,opacity:canSave?1:0.4,cursor:canSave?"pointer":"not-allowed"}} onClick={handleSave}>Save Rule</button>
            <button className="btn btn-secondary" onClick={onCancel}>Cancel</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── TxRow ─────────────────────────────────────────────────────────────────────
function TxRow({ t, onRemove, onEdit, editTxAmount }) {
  const ts = TYPE_STYLE[t.type] || TYPE_STYLE.notreported;
  const amtColor = t.type==="income"?"#10b981":t.type==="notreported"?"#9ca3af":"#f43f5e";
  const prefix   = t.type==="income"?"+":t.type==="notreported"?"±":"";
  const acctMeta = t.source?ACCOUNT_TYPE_META[t.source]:null;
  const displayName = t.nickname && t.nickname.trim() ? t.nickname.trim() : t.description;
  const hasNickname = !!(t.nickname && t.nickname.trim() && t.nickname.trim() !== t.description);
  const [swipeX, setSwipeX] = useState(0);
  const [editingAmt, setEditingAmt] = useState(false);
  const [amtDraft, setAmtDraft] = useState("");
  const pointerStartX = useRef(null);
  const isDragging = useRef(false);
  const SWIPE_DEL = 72;
  function onPointerDown(e){
    if(e.target.closest&&e.target.closest(".btn-danger,.amt-edit"))return;
    pointerStartX.current=e.clientX;
    isDragging.current=false;
    e.currentTarget.setPointerCapture(e.pointerId);
  }
  function onPointerMove(e){
    if(pointerStartX.current===null)return;
    const dx=pointerStartX.current-e.clientX;
    if(dx>4){isDragging.current=true;setSwipeX(Math.min(dx,SWIPE_DEL+20));}
    else if(dx<-4){isDragging.current=false;setSwipeX(0);}
  }
  function onPointerUp(){
    if(swipeX>=SWIPE_DEL){onRemove(t.id);}
    else{setSwipeX(0);}
    pointerStartX.current=null;
  }
  function onPointerCancel(){setSwipeX(0);pointerStartX.current=null;}
  function startAmtEdit(e){
    e.stopPropagation();
    setAmtDraft(String(Math.abs(t.amount)));
    setEditingAmt(true);
  }
  function commitAmt(){
    const v=parseFloat(amtDraft);
    if(!isNaN(v)&&v>0&&editTxAmount)editTxAmount(t.id,v);
    setEditingAmt(false);
  }
  const deleteOpacity=Math.min(swipeX/SWIPE_DEL,1);
  return (
    <div style={{position:"relative",overflow:"hidden"}}>
      <div style={{position:"absolute",right:0,top:0,bottom:0,width:SWIPE_DEL+20,background:"#f43f5e",display:"flex",alignItems:"center",justifyContent:"center",gap:5,pointerEvents:"none"}}>
        <span style={{fontSize:13,color:"#fff",opacity:deleteOpacity,transition:"opacity 0.1s"}}>Delete</span>
      </div>
      <div className="tx-row" style={{cursor:"pointer",transform:`translateX(-${swipeX}px)`,transition:swipeX===0?"transform 0.2s ease":"none",background:"#181818",position:"relative",zIndex:1,touchAction:"pan-y",borderLeft:"3px solid "+amtColor}}
        onClick={e=>{
          if(isDragging.current){isDragging.current=false;return;}
          if(swipeX>8){setSwipeX(0);return;}
          if(e.target.closest&&e.target.closest(".btn-danger,.amt-edit"))return;
          if(onEdit)onEdit(t);
        }}
        onPointerDown={onPointerDown}
        onPointerMove={onPointerMove}
        onPointerUp={onPointerUp}
        onPointerCancel={onPointerCancel}>
        <div style={{width:7,height:7,borderRadius:"50%",background:catColor(t.category),flexShrink:0,marginTop:t.note?2:0}}/>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:13,fontWeight:500,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",color:"#ddd"}}>{displayName}</div>
          {hasNickname && <div style={{fontSize:10,color:"#555",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",marginBottom:1,fontStyle:"italic"}}>{t.description}</div>}
          <div style={{display:"flex",gap:6,marginTop:3,alignItems:"center",flexWrap:"wrap"}}>
            <span style={{fontSize:10,color:"#737373"}}>{t.date}</span>
            <span className="tag" style={{background:catColor(t.category)+"18",color:catColor(t.category)}}>{t.category}</span>
            {t.subcategory && <span className="tag" style={{background:"#1e1e1e",color:"#888888"}}>{t.subcategory}</span>}
            <span className="tag" style={{background:ts.bg,color:ts.color}}>{TYPE_LABEL[t.type]||t.type}</span>
            {t.accountName
              ?<span className="tag" style={{background:(acctMeta?acctMeta.color:"#bbbbbb")+"18",color:(acctMeta?acctMeta.color:"#bbbbbb"),fontSize:9}}>{t.accountName}</span>
              :<span className="tag" style={{background:"#f9731618",color:"#f97316",fontSize:9}}>Not linked</span>
            }
          </div>
          {t.note && <div style={{fontSize:11,color:"#777777",marginTop:4,fontStyle:"italic",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>"{t.note}"</div>}
        </div>
        {editingAmt
          ?<input className="amt-edit" style={{width:72,background:"#111",border:"1px solid #555",borderRadius:5,color:amtColor,fontFamily:"inherit",fontSize:13,fontWeight:600,padding:"2px 6px",textAlign:"right"}}
            value={amtDraft} autoFocus
            onChange={e=>setAmtDraft(e.target.value)}
            onBlur={commitAmt}
            onKeyDown={e=>{if(e.key==="Enter")commitAmt();if(e.key==="Escape")setEditingAmt(false);}}
            onClick={e=>e.stopPropagation()}/>
          :<div className="amt-edit tx-row-amt" style={{fontWeight:600,fontSize:14,color:amtColor,whiteSpace:"nowrap",flexShrink:0,cursor:"text"}} onClick={startAmtEdit}>{prefix}{fmt(Math.abs(t.amount))}</div>
        }
        <button className="btn-danger tx-row-del" onClick={e=>{e.stopPropagation();onRemove(t.id);}}>×</button>
      </div>
    </div>
  );
}

// ── PieChart ──────────────────────────────────────────────────────────────────
function PieChart({ byCat, totalSpend }) {
  const [hoveredIdx, setHoveredIdx] = useState(null);
  const entries = Object.entries(byCat).sort((a,b)=>b[1].total-a[1].total);
  if (!entries.length || totalSpend <= 0) return null;
  const SIZE=220,CX=110,CY=110,R=88,INNER=54,GAP=0.018;
  const slices=[];
  let cum=-Math.PI/2;
  entries.forEach(([cat,{total}])=>{
    const frac=total/totalSpend,sweep=frac*2*Math.PI-GAP;
    if(sweep<=0)return;
    slices.push({cat,total,frac,startAngle:cum+GAP/2,sweep});
    cum+=frac*2*Math.PI;
  });
  const polar=(a,r)=>({x:CX+r*Math.cos(a),y:CY+r*Math.sin(a)});
  const hovered=hoveredIdx!==null?slices[hoveredIdx]:null;
  return (
    <div style={{display:"flex",alignItems:"center",gap:24,flexWrap:"wrap",justifyContent:"center",marginBottom:20}}>
      <div style={{flexShrink:0}}>
        <svg width={SIZE} height={SIZE} style={{display:"block"}}>
          {slices.map((s,i)=>{
            const isH=hoveredIdx===i,eR=isH?R+6:R,eI=isH?INNER-3:INNER;
            const p1=polar(s.startAngle,eR),p2=polar(s.startAngle+s.sweep,eR),p3=polar(s.startAngle+s.sweep,eI),p4=polar(s.startAngle,eI);
            const lg=s.sweep>Math.PI?1:0;
            const d=`M${p1.x} ${p1.y} A${eR} ${eR} 0 ${lg} 1 ${p2.x} ${p2.y} L${p3.x} ${p3.y} A${eI} ${eI} 0 ${lg} 0 ${p4.x} ${p4.y}Z`;
            return <path key={s.cat} d={d} fill={catColor(s.cat)} opacity={hoveredIdx===null||isH?1:0.45} style={{cursor:"pointer",transition:"opacity 0.15s"}} onMouseEnter={()=>setHoveredIdx(i)} onMouseLeave={()=>setHoveredIdx(null)}/>;
          })}
          {hovered?(<>
            <text x={CX} y={CY-8}  textAnchor="middle" fill="#e8e0d5" fontSize="13" fontWeight="600" fontFamily="DM Mono,monospace">{(hovered.frac*100).toFixed(1)+"%"}</text>
            <text x={CX} y={CY+10} textAnchor="middle" fill="#777"    fontSize="9"  fontFamily="DM Mono,monospace">{hovered.cat.length>14?hovered.cat.slice(0,13)+"…":hovered.cat}</text>
            <text x={CX} y={CY+26} textAnchor="middle" fill="#555"    fontSize="9"  fontFamily="DM Mono,monospace">{fmt(hovered.total)}</text>
          </>):(<>
            <text x={CX} y={CY-6}  textAnchor="middle" fill="#e8e0d5" fontSize="13" fontWeight="600" fontFamily="DM Mono,monospace">{fmt(totalSpend)}</text>
            <text x={CX} y={CY+12} textAnchor="middle" fill="#555"    fontSize="9"  fontFamily="DM Mono,monospace">total spent</text>
          </>)}
        </svg>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:7,minWidth:160,maxWidth:220}}>
        {slices.map((s,i)=>{
          const isH=hoveredIdx===i;
          return (
            <div key={s.cat} style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",opacity:hoveredIdx===null||isH?1:0.45,transition:"opacity 0.15s"}} onMouseEnter={()=>setHoveredIdx(i)} onMouseLeave={()=>setHoveredIdx(null)}>
              <div style={{width:9,height:9,borderRadius:"50%",background:catColor(s.cat),flexShrink:0}}/>
              <span style={{fontSize:11,color:isH?"#ddd":"#777",flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.cat}</span>
              <span style={{fontSize:10,color:isH?"#e8e0d5":"#444",fontWeight:isH?600:400,flexShrink:0}}>{(s.frac*100).toFixed(1)}%</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── BarChart ──────────────────────────────────────────────────────────────────
function BarChart({ transactions, currentMonth, currentYear, onMonthClick }) {
  const [hoveredIdx, setHoveredIdx] = useState(null);
  const numMonths = typeof window !== "undefined" && window.innerWidth <= 600 ? 6 : 12;
  const months=[];
  for(let i=numMonths-1;i>=0;i--){let m=currentMonth-i,y=currentYear;while(m<0){m+=12;y--;}months.push({month:m,year:y});}
  const data=months.map(mv=>{
    let income=0,expense=0;
    transactions.forEach(t=>{
      const d=new Date(t.date+"T00:00:00");
      if(d.getMonth()===mv.month&&d.getFullYear()===mv.year){
        if(t.type==="income")income+=t.amount;
        if(t.type==="expense")expense+=Math.abs(t.amount);
      }
    });
    return{month:mv.month,year:mv.year,income,expense};
  });
  const maxVal=Math.max(...data.flatMap(d=>[d.income,d.expense]),1);
  const W=660,H=160,PL=48,PB=28,PT=12,PR=8,cW=W-PL-PR,cH=H-PB-PT;
  const bGW=cW/numMonths,bW=Math.floor(bGW*0.32),gap=Math.floor(bGW*0.04);
  const bH=v=>Math.max(2,(v/maxVal)*cH);
  const bX=(i,w)=>PL+i*bGW+Math.floor((bGW-2*bW-gap)/2)+w*(bW+gap);
  const yTicks=[0,0.25,0.5,0.75,1].map(f=>f*maxVal);
  // Tooltip data for the hovered column — rendered last so it sits above all bars
  const tip=hoveredIdx!==null?data[hoveredIdx]:null;
  const tipI=hoveredIdx;
  return (
    <div style={{marginBottom:20,overflowX:"auto",WebkitOverflowScrolling:"touch",position:"relative"}}>
      <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{display:"block",fontFamily:"DM Mono,monospace",overflow:"visible",minWidth:numMonths===6?260:500}}>
        {/* Grid lines */}
        {yTicks.map((val,ti)=>{const yy=PT+cH-(val/maxVal)*cH;return(
          <g key={ti}>
            <line x1={PL} x2={W-PR} y1={yy} y2={yy} stroke="#1e1e1e" strokeWidth="1"/>
            <text x={PL-4} y={yy+4} textAnchor="end" fill="#333" fontSize="8">{val>=1000?"$"+Math.round(val/1000)+"k":"$"+Math.round(val)}</text>
          </g>
        );})}
        {/* Bars layer */}
        {data.map((d,i)=>{
          const isH=hoveredIdx===i,iH=bH(d.income),iX=bX(i,0),iY=PT+cH-iH,eH=bH(d.expense),eX=bX(i,1),eY=PT+cH-eH;
          const lX=PL+i*bGW+bGW/2,lY=H-PB+12,short=MONTHS[d.month].slice(0,3),isCur=d.month===currentMonth&&d.year===currentYear;
          return(
            <g key={i}
              onMouseEnter={()=>setHoveredIdx(i)}
              onMouseLeave={()=>setHoveredIdx(null)}
              onClick={()=>onMonthClick&&onMonthClick(d.month,d.year)}
              style={{cursor:"pointer"}}>
              <rect x={PL+i*bGW} width={bGW} y={PT} height={cH+PB} fill="transparent"/>
              {isH&&<rect x={PL+i*bGW} width={bGW} y={PT} height={cH} fill="#ffffff06" rx="2"/>}
              {d.income>0&&<rect x={iX} width={bW} y={iY} height={iH} fill="#10b981" opacity={isH?1:0.7} rx="2"/>}
              {d.expense>0&&<rect x={eX} width={bW} y={eY} height={eH} fill="#f43f5e" opacity={isH?1:0.7} rx="2"/>}
              <text x={lX} y={lY} textAnchor="middle" fontSize="8"
                fill={isCur?"#e8e0d5":isH?"#888":"#444"}
                fontWeight={isCur?"600":"400"}
                textDecoration={isH?"underline":"none"}>{short}</text>
            </g>
          );
        })}
        <line x1={PL} x2={W-PR} y1={PT+cH} y2={PT+cH} stroke="#252525" strokeWidth="1"/>
      </svg>
      {/* HTML tooltip overlay — uses real CSS px so it reads well on every screen size */}
      {tip&&tipI!==null&&(()=>{
        const leftPct=(PL+tipI*bGW+bGW/2)/W*100;
        return(
          <div style={{position:"absolute",top:4,left:`clamp(4px, calc(${leftPct}% - 68px), calc(100% - 144px))`,background:"#242424",border:"1px solid #3a3a3a",borderRadius:8,padding:"8px 12px",pointerEvents:"none",zIndex:10,minWidth:132,boxShadow:"0 4px 16px #00000066"}}>
            <div style={{fontSize:11,color:"#888",marginBottom:5,fontFamily:"DM Mono,monospace"}}>{MONTHS[tip.month].slice(0,3)+" "+tip.year}</div>

          <div style={{display:"flex",alignItems:"center",gap:5}}><div style={{width:8,height:8,borderRadius:2,background:"#10b981"}}/><span style={{fontSize:10,color:"#888888"}}>Income</span></div>
          <div style={{display:"flex",alignItems:"center",gap:5}}><div style={{width:8,height:8,borderRadius:2,background:"#f43f5e"}}/><span style={{fontSize:10,color:"#888888"}}>Expenses</span></div>
          <div className="hide-mobile" style={{display:"flex",alignItems:"center",gap:5}}><span style={{fontSize:10,color:"#888888"}}>↑ tap a bar to jump to that month</span></div>
        </div>
        <div style={{display:"flex",gap:4,flexShrink:0}}>
          {(()=>{
            const prevM=currentMonth===0?11:currentMonth-1;
            const prevY=currentMonth===0?currentYear-1:currentYear;
            const nextM=currentMonth===11?0:currentMonth+1;
            const nextY=currentMonth===11?currentYear+1:currentYear;
            return(<>
              <button className="btn-icon" style={{padding:"2px 9px",fontSize:12,lineHeight:1}} onClick={()=>onMonthClick&&onMonthClick(prevM,prevY)}>←</button>
              <button className="btn-icon" style={{padding:"2px 9px",fontSize:12,lineHeight:1}} onClick={()=>onMonthClick&&onMonthClick(nextM,nextY)}>→</button>
            </>);
          })()}
        </div>
      </div>
    </div>
  );
}

// ── CatBreakdown ──────────────────────────────────────────────────────────────
function CatBreakdown({ byCat, maxVal, taxonomy, totalSpend=0 }) {
  const subBudget=(cat,sub)=>(taxonomy.find(t=>t.category===cat&&t.subcategory===sub)||{}).budget||0;
  const catBudgetTotal=(cat,subs)=>Object.keys(subs).reduce((a,sub)=>a+subBudget(cat,sub),0);
  const entries=Object.entries(byCat).sort((a,b)=>b[1].total-a[1].total);
  if(!entries.length)return <div style={{textAlign:"center",color:"#5a5a5a",fontSize:13,padding:"20px 0"}}>No expense data yet.</div>;
  return(
    <div>
      {entries.map(([cat,data])=>{
        const budget=catBudgetTotal(cat,data.subs),overCat=budget>0&&data.total>budget,barMax=Math.max(maxVal,budget);
        const budgetUtil=budget>0?(data.total/budget*100):null;
        return(
          <div key={cat} style={{marginBottom:22}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:7}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <div style={{width:7,height:7,borderRadius:"50%",background:catColor(cat),flexShrink:0}}/>
                <span style={{fontSize:13,fontWeight:500,color:"#ccc"}}>{cat}</span>
                {budgetUtil!==null&&<span style={{fontSize:10,color:budgetUtil>100?"#f43f5e":budgetUtil>80?"#f97316":"#555",background:"#1e1e1e",borderRadius:100,padding:"1px 7px"}}>{budgetUtil.toFixed(0)}% of budget</span>}
              </div>
              <div style={{textAlign:"right"}}>
                <span style={{fontSize:13,color:overCat?"#f43f5e":"#666"}}>{fmt(data.total)}</span>
                {budget>0&&<span style={{fontSize:10,color:"#737373",marginLeft:6}}>/ {fmt(budget)}</span>}
              </div>
            </div>
            <div style={{background:"#1e1e1e",borderRadius:4,height:5,marginBottom:9,position:"relative"}}>
              <div style={{width:(Math.min(data.total/barMax,1)*100)+"%",height:"100%",borderRadius:4,background:overCat?"#f43f5e":catColor(cat),transition:"width 0.5s ease"}}/>
              {budget>0&&<div style={{position:"absolute",top:-2,bottom:-2,width:2,borderRadius:1,background:"#444",left:(Math.min(budget/barMax,1)*100)+"%"}}/>}
            </div>
            {Object.entries(data.subs).map(([sub,amt])=>{
              const bud=subBudget(cat,sub),over=bud>0&&amt>bud,pct=bud>0?Math.min(amt/bud*100,100):0;
              const barColor=over?"#f43f5e":pct>80?"#f97316":catColor(cat);
              return(
                <div key={sub} style={{padding:"5px 0 5px 16px",borderLeft:"1px solid "+catColor(cat)+"40",marginBottom:4}}>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:3}}>
                    <span style={{color:"#888888"}}>{sub}</span>
                    <div>
                      <span style={{color:over?"#f43f5e":"#555"}}>{fmt(amt)}</span>
                      {bud>0&&<span style={{color:"#606060",marginLeft:5}}>/ {fmt(bud)}</span>}
                      {bud===0&&<span style={{color:"#555555",marginLeft:5,fontSize:10}}>no budget</span>}
                    </div>
                  </div>
                  {bud>0&&<div style={{background:"#1a1a1a",borderRadius:3,height:3}}><div style={{width:pct+"%",height:"100%",borderRadius:3,background:barColor,transition:"width 0.5s ease"}}/></div>}
                </div>
              );
            })}
          </div>
        );
      })}
    </div>
  );
}

// ── SplitEditor ───────────────────────────────────────────────────────────────
function SplitEditor({ total, splits, onChange, taxonomy, cats, typeFilter }) {
  const LBL = {fontSize:9,letterSpacing:"0.12em",color:"#737373",textTransform:"uppercase",marginBottom:5};
  const allocated = splits.reduce((s,sp)=>s+(parseFloat(sp.amount)||0),0);
  const remaining = Math.round((total - allocated)*100)/100;
  const balanced   = Math.abs(remaining) < 0.005;

  function getSubs(cat) {
    const tf = typeFilter==="notreported"?"notreported":typeFilter;
    const seen={},out=[];
    taxonomy.forEach(t=>{
      if(t.category===cat&&!seen[t.subcategory]){
        const ok = tf==="notreported"?t.type==="notreported":(t.type===tf||t.type==="notreported");
        if(ok){seen[t.subcategory]=1;out.push(t.subcategory);}
      }
    });
    return out;
  }
  function update(id,patch){onChange(splits.map(sp=>sp.id===id?{...sp,...patch}:sp));}
  function remove(id){if(splits.length>2)onChange(splits.filter(sp=>sp.id!==id));}
  function addLine(){
    const fillAmt = remaining>0?remaining.toFixed(2):"";
    onChange([...splits,{id:Date.now()+Math.random(),amount:fillAmt,category:"",subcategory:""}]);
  }

  // Slider: only shown when exactly 2 splits and total > 0
  const showSlider = splits.length===2 && total>0;
  const sliderPct  = showSlider ? Math.round(((parseFloat(splits[0].amount)||0)/total)*100) : 50;

  function handleSlider(pct) {
    const a = Math.round(total*(pct/100)*100)/100;
    const b = Math.round((total-a)*100)/100;
    onChange([
      {...splits[0], amount: a>0?a.toFixed(2):""},
      {...splits[1], amount: b>0?b.toFixed(2):""},
    ]);
  }

  return(
    <div>
      {/* Slider for 2-split case */}
      {showSlider&&(
        <div style={{marginBottom:14}}>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"#888",marginBottom:5}}>
            <span style={{color:"#a78bfa"}}>{fmt(parseFloat(splits[0].amount)||0)}</span>
            <span style={{color:"#555",fontSize:9}}>{sliderPct}% · {100-sliderPct}%</span>
            <span style={{color:"#a78bfa"}}>{fmt(parseFloat(splits[1].amount)||0)}</span>
          </div>
          <input type="range" min={1} max={99} value={sliderPct}
            onChange={e=>handleSlider(parseInt(e.target.value))}
            style={{width:"100%",accentColor:"#8b5cf6",cursor:"pointer",height:4}}/>
        </div>
      )}
      <div style={{display:"grid",gridTemplateColumns:"80px 1fr 1fr 28px",gap:7,marginBottom:4}}>
        <div style={LBL}>Amount</div>
        <div style={LBL}>Category</div>
        <div style={LBL}>Subcategory</div>
        <div/>
      </div>
      {splits.map(sp=>{
        const subs=sp.category?getSubs(sp.category):[];
        return(
          <div key={sp.id} style={{display:"grid",gridTemplateColumns:"80px 1fr 1fr 28px",gap:7,marginBottom:7,alignItems:"center"}}>
            <input className="input" type="number" step="0.01" min="0.01" placeholder="0.00"
              value={sp.amount} onChange={e=>{
                update(sp.id,{amount:e.target.value});
                // Sync second split when editing first in 2-split mode
                if(showSlider&&sp.id===splits[0].id){
                  const a=parseFloat(e.target.value)||0;
                  const b=Math.max(0,Math.round((total-a)*100)/100);
                  onChange([{...splits[0],amount:e.target.value},{...splits[1],amount:b>0?b.toFixed(2):""}]);
                }
              }}
              style={{padding:"8px 10px",fontSize:12}}/>
            <select className="input" value={sp.category} style={{padding:"8px 10px",fontSize:12}}
              onChange={e=>{const c=e.target.value;const s=c?getSubs(c):[];update(sp.id,{category:c,subcategory:s[0]||""});}}>
              <option value="">— Category —</option>{cats.map(c=><option key={c} value={c}>{c}</option>)}
            </select>
            <select className="input" value={sp.subcategory} disabled={!sp.category}
              style={{padding:"8px 10px",fontSize:12}}
              onChange={e=>update(sp.id,{subcategory:e.target.value})}>
              <option value="">— Subcategory —</option>{subs.map(s=><option key={s} value={s}>{s}</option>)}
            </select>
            <button className="btn-danger" style={{fontSize:16,padding:"2px 6px",opacity:splits.length<=2?0.2:1,cursor:splits.length<=2?"not-allowed":"pointer"}}
              onClick={()=>remove(sp.id)}>×</button>
          </div>
        );
      })}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:4}}>
        <button className="btn-ghost" style={{fontSize:11,padding:"4px 12px"}} onClick={addLine}>+ Add line</button>
        <div style={{fontSize:11,fontWeight:500,color:balanced?"#10b981":remaining>0?"#f97316":"#f43f5e"}}>
          {balanced?"✓ Balanced":remaining>0?"Remaining: "+fmt(remaining):"Over by: "+fmt(Math.abs(remaining))}
        </div>
      </div>
    </div>
  );
}

// ── LineChart ─────────────────────────────────────────────────────────────────
function LineChart({ transactions, allTransactions, month, year, taxonomy }) {
  const [selCat, setSelCat] = useState("__all__");
  const [selSub, setSelSub] = useState("__all__");

  // Comparison overlay state
  const [showComp, setShowComp] = useState(false);
  const prevMonth = month === 0 ? 11 : month - 1;
  const prevMonthYear = month === 0 ? year - 1 : year;
  const [compMonth, setCompMonth] = useState(prevMonth);
  const [compYear, setCompYear]   = useState(prevMonthYear);

  // Quick-pick helpers
  function setLastMonth() { setCompMonth(prevMonth); setCompYear(prevMonthYear); }
  function setLastYear()  { setCompMonth(month);     setCompYear(year - 1); }

  // Available years from allTransactions
  const compYears = useMemo(() => {
    const yrs = new Set();
    (allTransactions||[]).forEach(t => yrs.add(new Date(t.date+"T00:00:00").getFullYear()));
    yrs.add(year - 1);
    return [...yrs].sort((a,b) => b - a);
  }, [allTransactions, year]);

  // Categories that have expense transactions this month
  const expCats = useMemo(() => {
    const seen = new Set();
    transactions.forEach(t => {
      if (t.type === "expense") seen.add(t.category);
    });
    return [...seen].sort();
  }, [transactions]);

  // Subcategories for selected category
  const subOptions = useMemo(() => {
    if (selCat === "__all__") return [];
    const seen = new Set();
    transactions.forEach(t => {
      if (t.type === "expense" && t.category === selCat) seen.add(t.subcategory);
    });
    return [...seen].sort();
  }, [transactions, selCat]);

  // Reset sub when cat changes
  const handleCatChange = (cat) => { setSelCat(cat); setSelSub("__all__"); };

  // Days in month
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const days = Array.from({ length: daysInMonth }, (_, i) => i + 1);

  // Cumulative spend per day
  const dailyTotals = useMemo(() => {
    const byDay = {};
    transactions.forEach(t => {
      if (t.type !== "expense") return;
      const d = new Date(t.date + "T00:00:00");
      if (d.getMonth() !== month || d.getFullYear() !== year) return;
      if (selCat !== "__all__" && t.category !== selCat) return;
      if (selSub !== "__all__" && t.subcategory !== selSub) return;
      const day = d.getDate();
      byDay[day] = (byDay[day] || 0) + Math.abs(t.amount);
    });
    // Build cumulative
    let running = 0;
    return days.map(d => {
      running += byDay[d] || 0;
      return { day: d, cumulative: running, daily: byDay[d] || 0 };
    });
  }, [transactions, month, year, selCat, selSub, daysInMonth]);

  // Comparison daily totals
  const compDaysInMonth = new Date(compYear, compMonth + 1, 0).getDate();
  const compDays = Array.from({ length: compDaysInMonth }, (_, i) => i + 1);
  const compDailyTotals = useMemo(() => {
    if (!showComp || !allTransactions) return null;
    const byDay = {};
    allTransactions.forEach(t => {
      if (t.type !== "expense") return;
      const d = new Date(t.date + "T00:00:00");
      if (d.getMonth() !== compMonth || d.getFullYear() !== compYear) return;
      if (selCat !== "__all__" && t.category !== selCat) return;
      if (selSub !== "__all__" && t.subcategory !== selSub) return;
      const day = d.getDate();
      byDay[day] = (byDay[day] || 0) + Math.abs(t.amount);
    });
    let running = 0;
    return compDays.map(d => {
      running += byDay[d] || 0;
      return { day: d, cumulative: running, daily: byDay[d] || 0 };
    });
  }, [showComp, allTransactions, compMonth, compYear, selCat, selSub]);

  const maxVal = Math.max(
    ...dailyTotals.map(d => d.cumulative),
    ...(compDailyTotals ? compDailyTotals.map(d => d.cumulative) : []),
    1
  );
  const minVal = 0;
  const hasData = dailyTotals.some(d => d.daily > 0);

  // Nice axis ticks
  function niceTicks(max, count = 5) {
    if (max <= 0) return [0];
    const rough = max / (count - 1);
    const magnitude = Math.pow(10, Math.floor(Math.log10(rough)));
    const nice = [1, 2, 2.5, 5, 10].map(f => f * magnitude)
      .find(f => f >= rough) || magnitude * 10;
    const niceMax = Math.ceil(max / nice) * nice;
    const ticks = [];
    for (let v = 0; v <= niceMax + nice * 0.01; v += nice) ticks.push(v);
    return ticks;
  }

  function fmtTick(v) {
    if (v >= 1000000) return "$" + (v / 1000000).toFixed(1).replace(/\.0$/, "") + "M";
    if (v >= 1000) return "$" + (v / 1000).toFixed(1).replace(/\.0$/, "") + "k";
    return "$" + Math.round(v);
  }

  const yTicks = niceTicks(maxVal);
  const chartMax = yTicks[yTicks.length - 1];

  // SVG dims
  const W = 660, H = 180, PL = 52, PB = 28, PT = 16, PR = 16;
  const cW = W - PL - PR, cH = H - PB - PT;

  const xPx     = d => PL + ((d - 1) / Math.max(daysInMonth - 1, 1)) * cW;
  const xPxComp = d => PL + ((d - 1) / Math.max(compDaysInMonth - 1, 1)) * cW;
  const yPx     = v => PT + cH - (v / chartMax) * cH;

  // Build SVG path (primary)
  const pathD = dailyTotals.map((d, i) =>
    (i === 0 ? "M" : "L") + xPx(d.day).toFixed(1) + " " + yPx(d.cumulative).toFixed(1)
  ).join(" ");

  // Area fill path
  const areaD = pathD +
    ` L${xPx(daysInMonth).toFixed(1)} ${(PT + cH).toFixed(1)}` +
    ` L${xPx(1).toFixed(1)} ${(PT + cH).toFixed(1)} Z`;

  // Build comparison SVG path
  const compColor = "#a78bfa";
  const compPathD = compDailyTotals ? compDailyTotals.map((d, i) =>
    (i === 0 ? "M" : "L") + xPxComp(d.day).toFixed(1) + " " + yPx(d.cumulative).toFixed(1)
  ).join(" ") : "";
  const compAreaD = compPathD ? compPathD +
    ` L${xPxComp(compDaysInMonth).toFixed(1)} ${(PT + cH).toFixed(1)}` +
    ` L${xPxComp(1).toFixed(1)} ${(PT + cH).toFixed(1)} Z` : "";

  // X-axis ticks — show every 5 days, always show 1 and last
  const xTickDays = days.filter(d => d === 1 || d === daysInMonth || d % 5 === 0);

  // Hover state
  const [hovDay, setHovDay] = useState(null);
  const hovData = hovDay !== null ? dailyTotals.find(d => d.day === hovDay) : null;

  // Line color based on selection
  const lineColor = selCat === "__all__" ? "#f43f5e" : catColor(selCat);
  const lineLabel = selCat === "__all__" ? "All Expenses"
    : selSub !== "__all__" ? selSub : selCat;

  return (
    <div>
      {/* Controls row 1: category + legend */}
      <div style={{display:"flex",gap:8,marginBottom:8,flexWrap:"wrap",alignItems:"center"}}>
        <select className="month-select" value={selCat} onChange={e=>handleCatChange(e.target.value)}
          style={{fontSize:11,padding:"5px 10px"}}>
          <option value="__all__">All Categories</option>
          {expCats.map(c=><option key={c} value={c}>{c}</option>)}
        </select>
        {selCat!=="__all__"&&subOptions.length>1&&(
          <select className="month-select" value={selSub} onChange={e=>setSelSub(e.target.value)}
            style={{fontSize:11,padding:"5px 10px"}}>
            <option value="__all__">All Subcategories</option>
            {subOptions.map(s=><option key={s} value={s}>{s}</option>)}
          </select>
        )}
        <div style={{display:"flex",alignItems:"center",gap:12,marginLeft:"auto",flexWrap:"wrap"}}>
          <div style={{display:"flex",alignItems:"center",gap:5}}>
            <div style={{width:12,height:3,borderRadius:2,background:lineColor}}/>
            <span style={{fontSize:10,color:"#888"}}>{lineLabel} — {MONTHS[month]} {year}</span>
          </div>
          {showComp&&compDailyTotals&&(
            <div style={{display:"flex",alignItems:"center",gap:5}}>
              <div style={{width:12,height:3,borderRadius:2,background:compColor,opacity:0.8}}/>
              <span style={{fontSize:10,color:"#888"}}>{MONTHS[compMonth]} {compYear}</span>
            </div>
          )}
        </div>
      </div>

      {/* Controls row 2: comparison toggle + selectors */}
      <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap",alignItems:"center"}}>
        <button
          className={"btn chip-sm "+(showComp?"chip-active":"chip-inactive")}
          style={{fontSize:10,padding:"3px 10px"}}
          onClick={()=>setShowComp(v=>!v)}>
          {showComp?"Hide comparison":"+ Compare month"}
        </button>
        {showComp&&(
          <>
            <button className="btn chip-sm chip-inactive" style={{fontSize:10,padding:"3px 10px",borderColor:"#a78bfa44",color:"#a78bfa"}}
              onClick={setLastMonth}>Last Month</button>
            <button className="btn chip-sm chip-inactive" style={{fontSize:10,padding:"3px 10px",borderColor:"#a78bfa44",color:"#a78bfa"}}
              onClick={setLastYear}>Last Year</button>
            <select className="month-select" value={compMonth} onChange={e=>setCompMonth(parseInt(e.target.value))}
              style={{fontSize:11,padding:"4px 8px"}}>
              {MONTHS.map((m,i)=><option key={i} value={i}>{m}</option>)}
            </select>
            <select className="month-select" value={compYear} onChange={e=>setCompYear(parseInt(e.target.value))}
              style={{fontSize:11,padding:"4px 8px"}}>
              {compYears.map(y=><option key={y} value={y}>{y}</option>)}
            </select>
          </>
        )}
      </div>

      {!hasData ? (
        <div style={{textAlign:"center",padding:"28px 0",color:"#5a5a5a",fontSize:12}}>
          No expense data for {MONTHS[month]} {year}{selCat!=="__all__"?" in "+lineLabel:""}.
        </div>
      ) : (
        <div style={{overflowX:"auto"}}>
          <svg width="100%" viewBox={`0 0 ${W} ${H}`}
            style={{display:"block",fontFamily:"DM Mono,monospace",overflow:"visible"}}
            onMouseLeave={()=>setHovDay(null)}>

            {/* Grid lines */}
            {yTicks.map((v,i)=>{
              const yy=yPx(v);
              return(
                <g key={i}>
                  <line x1={PL} x2={W-PR} y1={yy} y2={yy} stroke="#1e1e1e" strokeWidth="1"/>
                  <text x={PL-5} y={yy+3.5} textAnchor="end" fill="#444" fontSize="8.5">{fmtTick(v)}</text>
                </g>
              );
            })}

            {/* X axis */}
            <line x1={PL} x2={W-PR} y1={PT+cH} y2={PT+cH} stroke="#252525" strokeWidth="1"/>
            {xTickDays.map(d=>(
              <text key={d} x={xPx(d)} y={H-PB+12} textAnchor="middle" fill="#444" fontSize="8">{d}</text>
            ))}

            {/* Today marker — only shown when viewing the current month */}
            {month===new Date().getMonth()&&year===new Date().getFullYear()&&(()=>{
              const todayDay=new Date().getDate();
              const tx=xPx(todayDay);
              return(
                <g style={{pointerEvents:"none"}}>
                  <line x1={tx} x2={tx} y1={PT} y2={PT+cH} stroke="#e8e0d5" strokeWidth="1" strokeDasharray="3 4" opacity="0.25"/>
                  <text x={tx+3} y={PT+9} fill="#888" fontSize="7.5" letterSpacing="0.04em">today</text>
                </g>
              );
            })()}

            {/* Comparison area + line (rendered first, behind primary) */}
            {compDailyTotals&&compPathD&&(
              <>
                <path d={compAreaD} fill={compColor} opacity="0.06"/>
                <path d={compPathD} fill="none" stroke={compColor} strokeWidth="1.5" strokeDasharray="4 3" strokeLinejoin="round" strokeLinecap="round" opacity="0.75"/>
              </>
            )}

            {/* Area fill */}
            <path d={areaD} fill={lineColor} opacity="0.07"/>

            {/* Line */}
            <path d={pathD} fill="none" stroke={lineColor} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"/>

            {/* Invisible hit zones per day */}
            {days.map(d=>(
              <rect key={d}
                x={xPx(d)-(cW/daysInMonth/2)} width={cW/daysInMonth}
                y={PT} height={cH}
                fill="transparent"
                onMouseEnter={()=>setHovDay(d)}/>
            ))}

            {/* Hover dot + tooltip */}
            {hovData&&(()=>{
              const cx=xPx(hovData.day),cy=yPx(hovData.cumulative);
              const compHov=compDailyTotals?compDailyTotals.find(d=>d.day===hovData.day):null;
              const tipW=136,tipH=compHov?(hovData.daily>0?68:54):(hovData.daily>0?46:32);
              const tipX=cx+tipW+10>W-PR?cx-tipW-6:cx+8;
              const tipY=Math.max(PT,cy-tipH/2);
              return(
                <g style={{pointerEvents:"none"}}>
                  <circle cx={cx} cy={cy} r={4} fill={lineColor} stroke="#181818" strokeWidth="2"/>
                  {compHov&&<circle cx={xPxComp(hovData.day)} cy={yPx(compHov.cumulative)} r={3} fill={compColor} stroke="#181818" strokeWidth="1.5" opacity="0.8"/>}
                  <rect x={tipX} y={tipY} width={tipW} height={tipH} fill="#242424" stroke="#444" strokeWidth="0.75" rx="5"/>
                  <text x={tipX+8} y={tipY+12} fill="#888" fontSize="8">{MONTHS[month].slice(0,3)+" "+hovData.day+", "+year}</text>
                  <text x={tipX+8} y={tipY+25} fill={lineColor} fontSize="9" fontWeight="600">{"∑ "+fmt(hovData.cumulative)}</text>
                  {hovData.daily>0&&<text x={tipX+8} y={tipY+38} fill="#888" fontSize="8">{"+"+fmt(hovData.daily)+" today"}</text>}
                  {compHov&&<text x={tipX+8} y={tipY+(hovData.daily>0?52:38)} fill={compColor} fontSize="8" opacity="0.85">{"vs "+MONTHS[compMonth].slice(0,3)+" ∑ "+fmt(compHov.cumulative)}</text>}
                </g>
              );
            })()}
          </svg>
        </div>
      )}
    </div>
  );
}
function TaxPanel({ panelType, taxonomy, collapsedCats, setCollapsedCats,
  editingTaxIdx, editingTaxVal, setEditingTaxIdx, setEditingTaxVal, editingTaxSubcats,
  dragTaxIdx, setDragTaxIdx, dragOverTaxIdx, setDragOverTaxIdx,
  dropTax, startEditTax, commitEditTax, removeTaxEntry, removeCategoryGroup,
  newTax, setNewTax, taxSubcats, allCats, addTaxEntry, resetTaxonomy }) {
  const isExpense = panelType === "expense";
  const matchEntry = t => isExpense ? (t.type === "expense" || t.type === "notreported") : t.type === "income";
  const groups = [];
  const seenCat = {};
  taxonomy.forEach((t, idx) => {
    if (!matchEntry(t)) return;
    if (!seenCat[t.category]) { seenCat[t.category] = true; groups.push({ cat: t.category, entries: [] }); }
    groups[groups.length - 1].entries.push({ t, idx });
  });
  const totalBudget = groups.reduce((s, g) => s + g.entries.reduce((a, { t }) => a + (t.budget || 0), 0), 0);
  const accentColor = isExpense ? "#f43f5e" : "#10b981";
  const cellStyle = { cursor: "pointer", borderRadius: 4, padding: "3px 5px", transition: "background 0.12s" };
  return (

        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <div style={{ width: 7, height: 7, borderRadius: "50%", background: accentColor, flexShrink: 0 }} />
          <div className="sl" style={{ marginBottom: 0 }}>{isExpense ? "Expenses" : "Income"}</div>
          <span style={{ fontSize: 10, color: "#555555" }}>{groups.reduce((s, g) => s + g.entries.length, 0)}</span>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          {totalBudget > 0 && <span style={{ fontSize: 10, color: "#737373" }}>{fmt(totalBudget)}</span>}
          <button className="btn-reset" style={{ fontSize: 9, padding: "2px 8px" }} onClick={resetTaxonomy}>&#8634; Reset</button>
        </div>
      </div>
      {/* Column headers */}
      <div style={{ padding: "5px 12px 4px 16px", borderBottom: "1px solid #141414" }}>
        <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
          <div style={{ flex: "0 0 14px" }} />
          <div style={{ flex: "1 1 0", minWidth: 0, fontSize: 9, color: "#555555", letterSpacing: "0.12em", textTransform: "uppercase" }}>Subcategory</div>
          <div style={{ flex: "0 0 auto", fontSize: 9, color: "#555555", letterSpacing: "0.12em", textTransform: "uppercase", whiteSpace: "nowrap" }}>Budget</div>
          <div style={{ flex: "0 0 22px" }} />
        </div>
        <div style={{ fontSize: 9, color: "#484848", marginTop: 2, letterSpacing: "0.04em" }}>click to edit &nbsp;·&nbsp; &#8943; drag to reorder</div>
      </div>
      {/* Groups */}
      <div style={{ overflowY: "auto", flex: 1, maxHeight: 440 }}>
        {groups.length === 0 && (
          <div style={{ padding: "24px 16px", textAlign: "center", color: "#555555", fontSize: 12 }}>No {isExpense ? "expense" : "income"} categories yet.</div>
        )}
        {groups.map(({ cat, entries }) => {
          const collapseKey = cat + ":" + panelType;
          const isCollapsed = collapsedCats.has(collapseKey);
          const toggleCollapse = () => setCollapsedCats(prev => { const n = new Set(prev); n.has(collapseKey) ? n.delete(collapseKey) : n.add(collapseKey); return n; });
          const catBudget = entries.reduce((s, { t }) => s + (t.budget || 0), 0);
          return (
            <div key={cat}>
              <div onClick={toggleCollapse} style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 12px 6px 16px", background: "#111", borderBottom: "1px solid #1e1e1e", borderTop: "1px solid #1a1a1a", cursor: "pointer", userSelect: "none" }} className="group-header">
                <div style={{ width: 7, height: 7, borderRadius: "50%", background: catColor(cat), flexShrink: 0 }} />
                <div style={{ flex: 1, fontSize: 11, fontWeight: 500, color: "#bbb", letterSpacing: "0.04em" }}>{cat}</div>
                {catBudget > 0 && <div style={{ fontSize: 10, color: "#737373" }}>{fmt(catBudget)}</div>}
                {cat !== "Not Assigned" && (
                  <button className="btn-danger" style={{ fontSize: 12, padding: "1px 6px", opacity: 0.4 }} title={"Remove " + cat}
                    onClick={e => { e.stopPropagation(); removeCategoryGroup(cat); }}>×</button>
                )}
                <div style={{ fontSize: 10, color: "#555555", width: 12, textAlign: "center" }}>{isCollapsed ? "▶" : "▼"}</div>
              </div>
              {!isCollapsed && entries.map(({ t, idx }) => {
                const isEd = editingTaxIdx === idx, ev = editingTaxVal;
                const isDragOver = dragOverTaxIdx === idx && dragTaxIdx !== idx;
                const isDragging = dragTaxIdx === idx;
                return (
                  <div key={idx} className="edit-row"
                    draggable={!isEd}
                    onDragStart={() => { setDragTaxIdx(idx); setEditingTaxIdx(null); setEditingTaxVal({}); }}
                    onDragOver={e => { e.preventDefault(); setDragOverTaxIdx(idx); }}
                    onDragLeave={() => { if (dragOverTaxIdx === idx) setDragOverTaxIdx(null); }}
                    onDrop={() => dropTax(idx)}
                    onDragEnd={() => { setDragTaxIdx(null); setDragOverTaxIdx(null); }}
                    style={{ paddingLeft: 12, paddingRight: 8, background: isDragOver ? "#1f1a2e" : isEd ? "#1e1e1e" : "", flexWrap: isEd ? "wrap" : "nowrap", alignItems: isEd ? "flex-start" : "center", gap: 6, opacity: isDragging ? 0.4 : 1, borderTop: isDragOver ? "2px solid #8b5cf6" : "", transition: "border 0.1s,opacity 0.1s" }}>
                    {!isEd && <div style={{ flex: "0 0 14px", cursor: "grab", color: "#555555", fontSize: 11, userSelect: "none", textAlign: "center" }}>&#8942;</div>}
                    {isEd ? (
                      <div style={{ width: "100%", display: "grid", gridTemplateColumns: "1fr 1fr", gap: 7 }}>
                        <div>
                          <div style={{ fontSize: 9, color: "#737373", marginBottom: 3, letterSpacing: "0.1em", textTransform: "uppercase" }}>Category</div>
                          <input className="input-sm" list="cat-list-edit" value={ev.category} onChange={e => setEditingTaxVal(f => ({ ...f, category: e.target.value }))} onKeyDown={e => { if (e.key === "Escape") { setEditingTaxIdx(null); setEditingTaxVal({}); } }} style={{ width: "100%" }} autoFocus />
                          <datalist id="cat-list-edit">{allCats.map(c => <option key={c} value={c} />)}</datalist>
                        </div>
                        <div>
                          <div style={{ fontSize: 9, color: "#737373", marginBottom: 3, letterSpacing: "0.1em", textTransform: "uppercase" }}>Subcategory</div>
                          <input className="input-sm" list="sub-list-edit" value={ev.subcategory} onChange={e => setEditingTaxVal(f => ({ ...f, subcategory: e.target.value }))} onKeyDown={e => { if (e.key === "Escape") { setEditingTaxIdx(null); setEditingTaxVal({}); } }} style={{ width: "100%" }} />
                          <datalist id="sub-list-edit">{editingTaxSubcats.map(s => <option key={s} value={s} />)}</datalist>
                        </div>
                        <div>
                          <div style={{ fontSize: 9, color: "#737373", marginBottom: 3, letterSpacing: "0.1em", textTransform: "uppercase" }}>Type</div>
                          <select className="input-sm" value={ev.type} onChange={e => setEditingTaxVal(f => ({ ...f, type: e.target.value }))} style={{ width: "100%" }}>
                            <option value="expense">Expense</option><option value="income">Income</option><option value="notreported">Not Reported</option>
                          </select>
                        </div>
                        <div>
                          <div style={{ fontSize: 9, color: "#737373", marginBottom: 3, letterSpacing: "0.1em", textTransform: "uppercase" }}>Budget (CAD)</div>
                          <input className="input-sm" type="number" value={ev.budget} onChange={e => setEditingTaxVal(f => ({ ...f, budget: e.target.value }))} onKeyDown={e => { if (e.key === "Escape") { setEditingTaxIdx(null); setEditingTaxVal({}); } }} style={{ width: "100%" }} />
                        </div>
                        <div style={{ gridColumn: "1 / -1", display: "flex", gap: 8, marginTop: 2 }}>
                          <button className="btn btn-primary" style={{ padding: "6px 16px", fontSize: 12 }} onClick={commitEditTax}>Save</button>
                          <button className="btn-ghost" onClick={() => { setEditingTaxIdx(null); setEditingTaxVal({}); }}>Cancel</button>
                        </div>
                      </div>
                    ) : (<>
                      <div style={{ flex: "0 0 18px", display: "flex", alignItems: "center" }}><div style={{ width: 5, height: 5, borderRadius: "50%", background: catColor(t.category), opacity: 0.4 }} /></div>
                      <div style={{ ...cellStyle, flex: "1 1 0", fontSize: 12, color: "#bbbbbb", minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }} onClick={() => startEditTax(idx)}>{t.subcategory}</div>
                      <div style={{ ...cellStyle, flex: "0 0 auto", fontSize: 11, color: "#888888", textAlign: "right", whiteSpace: "nowrap" }} onClick={() => startEditTax(idx)}>{t.budget > 0 ? fmt(t.budget) : <span style={{ color: "#555555" }}>—</span>}</div>
                      <div style={{ flex: "0 0 22px", textAlign: "right" }}><button className="btn-danger" style={{ fontSize: 13, padding: "0 2px" }} onClick={() => removeTaxEntry(idx)}>×</button></div>
                    </>)}
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>
      {/* Add entry form */}
      <div className="add-form" style={{ borderTop: "1px solid #1e1e1e" }}>
        <div style={{ fontSize: 9, letterSpacing: "0.15em", color: "#737373", textTransform: "uppercase", marginBottom: 8 }}>Add Entry</div>
        <div style={{ display: "grid", gap: 7 }}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 7 }}>
            <div>
              <div style={{ fontSize: 9, color: "#737373", marginBottom: 3, letterSpacing: "0.1em", textTransform: "uppercase" }}>Category</div>
              <input className="input-sm" list={"cat-list-" + panelType} placeholder={isExpense?"e.g. Groceries":"e.g. Work"} value={newTax.category}
                onChange={e => setNewTax(f => ({ ...f, category: e.target.value, subcategory: "" }))} />
              <datalist id={"cat-list-" + panelType}>
                {(isExpense ? computeExpenseCats(taxonomy) : computeIncomeCats(taxonomy)).map(c => <option key={c} value={c} />)}
              </datalist>
            </div>

              <div style={{ fontSize: 9, color: "#737373", marginBottom: 3, letterSpacing: "0.1em", textTransform: "uppercase" }}>Subcategory</div>

              <datalist id={"sub-list-" + panelType}>
                {(()=>{
                  if(!newTax.category)return[];
                  const tf=isExpense?"expense":"income";
                  const seen={},out=[];
                  taxonomy.forEach(t=>{if(t.category===newTax.category&&!seen[t.subcategory]){const m=tf==="notreported"?t.type==="notreported":(t.type===tf||t.type==="notreported");if(m){seen[t.subcategory]=1;out.push(t.subcategory);}}});
                  return out;
                })().map(s => <option key={s} value={s} />)}
              </datalist>
            </div>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 7, alignItems: "end" }}>
            <div>
              <div style={{ fontSize: 9, color: "#737373", marginBottom: 5, letterSpacing: "0.1em", textTransform: "uppercase" }}>Type</div>

                    onClick={() => setNewTax(f => ({ ...f, type: tf }))} style={{ fontSize: 9, padding: "2px 8px" }}>
                    {tf === "notreported" ? "Not Rep." : tf[0].toUpperCase() + tf.slice(1)}
                  </button>
                ))}
              </div>
            </div>
            <div>
              <div style={{ fontSize: 9, color: "#737373", marginBottom: 3, letterSpacing: "0.1em", textTransform: "uppercase" }}>Budget (CAD)</div>
              <input className="input-sm" type="number" placeholder="0.00" value={newTax.budget} onChange={e => setNewTax(f => ({ ...f, budget: e.target.value }))} />
            </div>
          </div>
          <button className="btn btn-primary" onClick={() => addTaxEntry(isExpense ? undefined : "income")} style={{ width: "100%", padding: "8px", fontSize: 12 }}>+ Add Entry</button>
        </div>
      </div>
    </div>
  );
}

// ── EditRuleModal ─────────────────────────────────────────────────────────────
function EditRuleModal({ rule, taxonomy, onSave, onCancel }) {
  const expenseCats = useMemo(() => computeExpenseCats(taxonomy), [taxonomy]);
  const incomeCats  = useMemo(() => computeIncomeCats(taxonomy),  [taxonomy]);
  const [val, setVal] = useState({ ...rule });
  const [patternError, setPatternError] = useState("");

  const cats = val.type === "income" ? incomeCats : expenseCats;
  const subcats = useMemo(() => {
    if (!val.category) return [];
    const tf = val.type === "auto" ? "expense" : val.type;
    const seen = {}, out = [];
    taxonomy.forEach(t => {
      if (t.category === val.category && !seen[t.subcategory]) {
        const m = tf === "notreported" ? t.type === "notreported" : (t.type === tf || t.type === "notreported");
        if (m) { seen[t.subcategory] = 1; out.push(t.subcategory); }
      }
    });
    return out;
  }, [taxonomy, val.category, val.type]);

  function handleSave() {
    setPatternError("");
    if (!val.pattern.trim()) { setPatternError("A pattern is required."); return; }
    if (!isSafePattern(val.pattern.trim())) { setPatternError("Invalid or unsafe pattern. Check for syntax errors or nested quantifiers."); return; }
    if (!val.category || !val.subcategory) return;
    onSave({ ...val, pattern: val.pattern.trim(), nickname: (val.nickname || "").trim() });
  }

  const ts = TYPE_STYLE[val.type] || TYPE_STYLE.auto;
  const canSave = val.pattern && val.category && val.subcategory;

  return (
    <div className="modal-overlay" onClick={e => { if (e.target === e.currentTarget) onCancel(); }}>
      <div className="modal-box" style={{ background:"#181818", border:"1px solid #2e2e2e", borderRadius:16, width:"100%", maxWidth:500, boxShadow:"0 24px 64px rgba(0,0,0,0.7)", maxHeight:"90vh", overflowY:"auto" }}>
        <div style={{ padding:"18px 22px 14px", borderBottom:"1px solid #222", display:"flex", justifyContent:"space-between", alignItems:"flex-start", position:"sticky", top:0, background:"#181818", zIndex:1 }}>
          <div>
            <div style={{ fontSize:10, letterSpacing:"0.2em", color:"#737373", textTransform:"uppercase", marginBottom:4 }}>Edit Rule</div>
            <code style={{ fontSize:12, color:"#8b5cf6" }}>{rule.pattern}</code>
          </div>
          <button className="btn-danger" style={{ fontSize:20, padding:"4px 10px" }} onClick={onCancel}>×</button>
        </div>

        <div style={{ padding:"18px 22px", display:"grid", gap:16 }}>
          {/* Pattern */}
          <div>
            <div style={{ fontSize:9, letterSpacing:"0.15em", color:"#737373", textTransform:"uppercase", marginBottom:6 }}>Match Pattern <span style={{ color:"#555", letterSpacing:"0.04em", textTransform:"none", fontSize:10 }}>— regex, max 200 chars</span></div>
            <input className={"input"+(patternError?" input-error":"")} value={val.pattern} maxLength={200} onChange={e => { setVal(f => ({ ...f, pattern:e.target.value })); setPatternError(""); }} onKeyDown={e => { if (e.key==="Enter"&&canSave) handleSave(); if (e.key==="Escape") onCancel(); }} style={{ fontFamily:"monospace", color:"#8b5cf6" }} autoFocus/>
            {patternError && <div style={{ fontSize:11, color:"#f43f5e", marginTop:4 }}>{patternError}</div>}
          </div>

          {/* Classification */}
          <div>
            <div style={{ fontSize:9, letterSpacing:"0.15em", color:"#737373", textTransform:"uppercase", marginBottom:8 }}>Classification</div>
            <RuleTypeSelector value={val.type || "auto"} onChange={v => setVal(f => ({ ...f, type:v, category:"", subcategory:"" }))} />
          </div>

          {/* Category + Subcategory */}
          <div className="grid-2">
            <div>
              <div style={{ fontSize:9, letterSpacing:"0.12em", color:"#737373", textTransform:"uppercase", marginBottom:6 }}>Category</div>
              <select className="input" value={val.category} onChange={e => setVal(f => ({ ...f, category:e.target.value, subcategory:"" }))}>
                <option value="">— Select —</option>
                {cats.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            <div>
              <div style={{ fontSize:9, letterSpacing:"0.12em", color:"#737373", textTransform:"uppercase", marginBottom:6 }}>Subcategory</div>
              <select className="input" value={val.subcategory} disabled={!val.category} onChange={e => setVal(f => ({ ...f, subcategory:e.target.value }))}>
                <option value="">— Select —</option>
                {subcats.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
            </div>
          </div>

          {/* Nickname */}
          <div>
            <div style={{ fontSize:9, letterSpacing:"0.15em", color:"#737373", textTransform:"uppercase", marginBottom:6 }}>Nickname <span style={{ color:"#555", letterSpacing:"0.04em", textTransform:"none", fontSize:10 }}>— optional display name for matched transactions</span></div>
            <input className="input" placeholder="Leave blank to use original description" value={val.nickname || ""} maxLength={100} onChange={e => setVal(f => ({ ...f, nickname:e.target.value }))} onKeyDown={e => { if (e.key==="Enter"&&canSave) handleSave(); }}/>

// ── parseDateSearch ───────────────────────────────────────────────────────────
// Returns a (isoDateStr) => bool matcher if q looks like a date query, else null.
// Supported: "2025-03-15", "2025-03", "2025", "March", "Mar",
//            "March 15", "March 15th", "Mar 15th",
//            "March 2025", "Mar 2025",
//            "March 15, 2025", "Mar 15th 2025"
function parseDateSearch(q) {
  const s = q.trim().toLowerCase();
  if (!s) return null;
  const MF = ["january","february","march","april","may","june","july","august","september","october","november","december"];
  const MS = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
  function mIdx(name) {
    const n = name.toLowerCase().replace(/[.,]+$/,"");
    let i = MF.indexOf(n); if (i >= 0) return i;
    i = MS.indexOf(n.slice(0,3)); return i;
  }
  function pad(n) { return String(parseInt(n)).padStart(2,"0"); }

  // ISO exact: 2025-03-15
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return d => d === s;
  // ISO year-month: 2025-03
  const ym = s.match(/^(\d{4})-(\d{2})$/);
  if (ym) return d => d.startsWith(ym[1]+"-"+ym[2]);
  // Year only: 2025
  if (/^\d{4}$/.test(s)) return d => d.startsWith(s+"-");
  // Month + day + year: "March 15, 2025" / "Mar 15th 2025"
  const mdy = s.match(/^([a-z]+)\.?\s+(\d{1,2})(?:st|nd|rd|th)?[,.]?\s+(\d{4})$/);
  if (mdy) { const mi=mIdx(mdy[1]); if (mi>=0) { const mm=pad(mi+1),dd=pad(mdy[2]),y=mdy[3]; return d=>d===y+"-"+mm+"-"+dd; } }
  // Month + day: "March 15" / "Mar 15th"
  const md = s.match(/^([a-z]+)\.?\s+(\d{1,2})(?:st|nd|rd|th)?[,.]?\s*$/);
  if (md) { const mi=mIdx(md[1]); if (mi>=0) { const mm=pad(mi+1),dd=pad(md[2]); return d=>d.slice(5,7)===mm&&d.slice(8,10)===dd; } }
  // Month + year: "March 2025" / "Mar 2025"
  const my = s.match(/^([a-z]+)\.?\s+(\d{4})$/);
  if (my) { const mi=mIdx(my[1]); if (mi>=0) { const mm=pad(mi+1),y=my[2]; return d=>d.startsWith(y+"-"+mm); } }
  // Month name only: "March" / "mar"
  const mo = mIdx(s);
  if (mo >= 0) { const mm=pad(mo+1); return d=>d.slice(5,7)===mm; }
  return null;
}

  const expenseCats = useMemo(()=>computeExpenseCats(taxonomy),[taxonomy]);

  const allCats     = useMemo(()=>{const seen={},out=[];taxonomy.forEach(t=>{if(!seen[t.category]){seen[t.category]=1;out.push(t.category);}});return out;},[taxonomy]);
