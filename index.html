  const availableCats    = form.typeFilter==="income"?incomeCats:expenseCats;
  const availableSubcats = form.category?getSubcats(taxonomy,form.category,form.typeFilter):[];
  const editingRuleSubcats = useMemo(()=>{
    if(!editingRuleVal.category)return[];
    const tf = editingRuleVal.type==="auto"?"expense":editingRuleVal.type;
    const seen={},out=[];
    taxonomy.forEach(t=>{if(t.category===editingRuleVal.category&&!seen[t.subcategory]){const m=tf==="notreported"?t.type==="notreported":(t.type===tf||t.type==="notreported");if(m){seen[t.subcategory]=1;out.push(t.subcategory);}}});
    return out;
  },[taxonomy,editingRuleVal.category,editingRuleVal.type]);
  const editingTaxSubcats  = useMemo(()=>{if(!editingTaxVal.category)return[];const tf=editingTaxVal.type;const seen={},out=[];taxonomy.forEach(t=>{if(t.category===editingTaxVal.category&&!seen[t.subcategory]){const match=!tf||(tf==="notreported"?t.type==="notreported":t.type===tf);if(match){seen[t.subcategory]=1;out.push(t.subcategory);}}});return out;},[taxonomy,editingTaxVal.category,editingTaxVal.type]);
  const ruleSubcats = useMemo(()=>{
    if(!newRule.category)return[];
    const tf = newRule.type==="auto"?"expense":newRule.type;
    const seen={},out=[];
    taxonomy.forEach(t=>{if(t.category===newRule.category&&!seen[t.subcategory]){const m=tf==="notreported"?t.type==="notreported":(t.type===tf||t.type==="notreported");if(m){seen[t.subcategory]=1;out.push(t.subcategory);}}});
    return out;
  },[taxonomy,newRule.category,newRule.type]);
  const taxSubcats  = useMemo(()=>{if(!newTax.category)return[];const tf=newTax.type;const seen={},out=[];taxonomy.forEach(t=>{if(t.category===newTax.category&&!seen[t.subcategory]){const match=!tf||(tf==="notreported"?t.type==="notreported":t.type===tf);if(match){seen[t.subcategory]=1;out.push(t.subcategory);}}});return out;},[taxonomy,newTax.category,newTax.type]);
  const monthlyBudget = useMemo(()=>taxonomy.filter(t=>t.type==="expense").reduce((s,t)=>s+(t.budget||0),0),[taxonomy]);
  const rulePreviewMatches = useMemo(()=>{
    const pat=newRule.pattern.trim();
    if(!pat||!isSafePattern(pat))return[];
    try{
      const re=new RegExp(pat,"i");
      return transactions.filter(t=>!t._splitParent&&re.test(t.description))
        .sort((a,b)=>new Date(b.date)-new Date(a.date))
        .slice(0,5);
    }catch{return[];}
  },[newRule.pattern,transactions]);

  // ── Transaction helpers ───────────────────────────────────────────────────
  function handleCatChange(cat){const subs=getSubcats(taxonomy,cat,form.typeFilter);setForm(f=>({...f,category:cat,subcategory:subs[0]||""}));}
  function handleTFChange(tf){setForm(f=>({...f,typeFilter:tf,category:"",subcategory:""}));}
  function addTransaction(){
    if(!form.description||!form.amount||!form.category||!form.subcategory)return;
    const amt=parseFloat(form.amount);
    if(isNaN(amt)||amt<=0){setAmountError("Enter a valid positive amount.");return;}
    if(amt>999999){setAmountError("Amount seems unusually large (max $999,999).");return;}
    setAmountError("");
    // Duplicate check — same description + amount + date already exists
    const isDup=transactions.some(t=>t.description.toLowerCase()===form.description.toLowerCase()&&Math.abs(t.amount)===amt&&t.date===form.date);
    if(isDup&&!dupWarning){setDupWarning(true);return;}
    setDupWarning(false);
    const tax=getTaxonomyEntry(taxonomy,form.category,form.subcategory,form.typeFilter);
    const rt=tax.type||form.typeFilter,sign=rt==="income"?1:-1;
    const linkedAcct=form.accountId?accounts.find(a=>a.id===form.accountId):null;

  function addTaxEntry(typeOverride){
    if(!newTax.category.trim()||!newTax.subcategory.trim())return;
    const entryType=typeOverride||newTax.type;
    const entry={category:newTax.category.trim(),subcategory:newTax.subcategory.trim(),type:entryType,budget:parseFloat(newTax.budget)||0};
    setTaxonomy(prev=>{
      // Find the index of the last existing entry with the same category
      let lastIdx=-1;
      prev.forEach((t,i)=>{if(t.category===entry.category)lastIdx=i;});
      if(lastIdx===-1){
        // New category — append at the end
        return [...prev,entry];
      }
      // Existing category — insert immediately after its last entry
      const next=[...prev];
      next.splice(lastIdx+1,0,entry);
      return next;
    });

  }

  function addRuleEntry(){

    if(!isSafePattern(newRule.pattern.trim())){showConfirm("Invalid pattern","The regex pattern is invalid or contains nested quantifiers.","OK",false,()=>{});return;}
    const newPat=newRule.pattern.trim();
    const shadowedBy=descRules.find(r=>{
      try{
        // Check if the new rule's sample matches are all already caught by an existing rule
        // Simpler practical check: if any existing rule's pattern matches everything the new one matches
        // We test by checking if existing rule regex matches the new pattern string itself (heuristic)
        // Real check: existing rule fires before new one for any string the new rule would match
        return r!==newRule&&new RegExp(r.pattern,"i").test(newPat);
      }catch{return false;}
    });
    if(shadowedBy){
      showConfirm(
        "This rule may be shadowed",
        `An earlier rule with pattern "${shadowedBy.pattern}" could match the same transactions and always fires first. This new rule may never be reached. Add it anyway?`,
        "Add Anyway",false,
        ()=>{setDescRules(prev=>[...prev,{pattern:newPat,category:newRule.category,subcategory:newRule.subcategory,type:newRule.type,nickname:newRule.nickname||""}]);setNewRule(BLANK_RULE);}

  function commitInlineBudget(cat,sub,rawVal){
    const val=parseFloat(rawVal)||0;
    // Find existing taxonomy entries for this cat+sub
    const idxs=taxonomy.reduce((a,t,i)=>t.category===cat&&t.subcategory===sub?[...a,i]:a,[]);
    if(idxs.length>0){
      // Update the first matching entry, zero any extras
      setTaxonomy(prev=>prev.map((t,i)=>{
        if(i===idxs[0])return{...t,budget:val};
        if(idxs.includes(i))return{...t,budget:0};
        return t;
      }));
    } else {
      // No taxonomy entry exists — create one (expense type)
      const entry={category:cat,subcategory:sub,type:"expense",budget:val};
      setTaxonomy(prev=>{
        let lastIdx=-1;
        prev.forEach((t,i)=>{if(t.category===cat)lastIdx=i;});
        if(lastIdx===-1)return[...prev,entry];

  function reRunRules(){
    if(descRules.length===0){showConfirm("No rules to apply","Add some description rules first, then re-run them against your transactions.","OK",false,()=>{});return;}
    const eligible=transactions.filter(t=>t.category==="Not Assigned"||t.subcategory==="Not Assigned");
    if(eligible.length===0){showConfirm("Nothing to update","All transactions already have a category assigned.","OK",false,()=>{});return;}
    const updated=[];
    const newTx=transactions.map(t=>{
      if(t.category!=="Not Assigned"&&t.subcategory!=="Not Assigned")return t;
      const m=matchDesc(descRules,t.description,t.amount);
      if(!m.matched)return t;
      const fA=m.type==="income"?Math.abs(t.amount):m.type==="expense"?-Math.abs(t.amount):t.amount;
      updated.push(t.description);
      return{...t,category:m.category,subcategory:m.subcategory,type:m.type,amount:fA,nickname:m.nickname||t.nickname||""};
    });
    showConfirm(
      `Re-run rules on ${eligible.length} unassigned transaction${eligible.length!==1?"s":""}?`,
      `${descRules.length} rule${descRules.length!==1?"s":""} will be tested in order against every "Not Assigned" transaction. Matched transactions will be updated automatically.`,
      "Re-run Rules",false,
      ()=>{
        setTransactions(newTx);
        const matched=updated.length;
        setImportStatus({count:matched,errors:0,dupes:0,fileType:"rerun",unmatched:eligible.length-matched});
        setTimeout(()=>setImportStatus(null),5000);
      }
    );
  }

  function handleBackupExport(){

      version:4,

      descRules,

      rolloverSubs:[...rolloverSubs],

  function handleBackupImport(e){
    const file=e.target.files[0];if(!file)return;e.target.value="";
    const reader=new FileReader();
    reader.onload=evt=>{
      try{
        const b=JSON.parse(evt.target.result);
        const v=b&&b.version;
        const isValidVersion=(v===1||v===2||v===3||v===4);
        const hasData=b&&Array.isArray(b.transactions);
        if(!hasData||!isValidVersion){showConfirm("Invalid backup file","This file doesn't appear to be a valid Budget Tracker backup.","OK",false,()=>{});return;}
        const txN=(b.transactions||[]).length,taxN=(b.taxonomy||[]).length,rN=(b.descRules||[]).length,acctN=(b.accounts||[]).length;
        const rolloverN=Array.isArray(b.rolloverSubs)?b.rolloverSubs.length:0;
        const detail=`This will permanently overwrite all current data with ${txN} transaction${txN!==1?"s":""}, ${acctN} account${acctN!==1?"s":""}, ${taxN} categor${taxN!==1?"ies":"y"}, ${rN} rule${rN!==1?"s":""}${rolloverN>0?`, and ${rolloverN} rollover setting${rolloverN!==1?"s":""}`:""}. This cannot be undone.`
          +(v===1?" (Legacy v1 backup — transactions will appear as Not Linked until assigned to an account.)"
           :v===2?" (v2 backup — nickname fields on transactions and rules will be empty and can be re-added manually.)"
           :v===3?" (v3 backup — rollover settings were not included and will be reset.)":"");
        pendingBackupRef.current=b;
        showConfirm("Restore this backup?",detail,"Restore Backup",true,()=>{
          const bk=pendingBackupRef.current;
          // Restore accounts first so we can build the lookup map
          const restoredAccounts=Array.isArray(bk.accounts)&&bk.accounts.length>0?bk.accounts:[];
          if(restoredAccounts.length>0)setAccounts(restoredAccounts);
          // Build id→account map for re-linking
          const acctMap={};restoredAccounts.forEach(a=>{acctMap[a.id]=a;});
          // Re-link transactions: ensure accountName stays consistent with restored account objects
          if(Array.isArray(bk.transactions)&&bk.transactions.length>0){
            const linked=bk.transactions.map(t=>{
              if(!t.accountId)return t;
              const acct=acctMap[t.accountId];
              if(acct)return{...t,accountId:acct.id,accountName:acct.name,source:acct.type};
              return{...t,accountId:null,accountName:null,source:null};
            });
            setTransactions(linked);
          }
          if(Array.isArray(bk.taxonomy)&&bk.taxonomy.length>0)setTaxonomy(bk.taxonomy);
          if(Array.isArray(bk.descRules)&&bk.descRules.length>0)setDescRules(bk.descRules);
          // Rollover settings (v4+)
          if(Array.isArray(bk.rolloverSubs))setRolloverSubs(new Set(bk.rolloverSubs));
          if(Array.isArray(bk.rolloverMode))setRolloverMode(new Map(bk.rolloverMode));
          pendingBackupRef.current=null;
        });
      }catch(err){showConfirm("Could not read file","Make sure it is a valid JSON backup exported from this app.","OK",false,()=>{});}
    };
    reader.readAsText(file);
  }

        const data=new Uint8Array(evt.target.result);
        const wb=XLSX.read(data,{type:"array",cellDates:true});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});

        // ── Detect header row and first data row ──────────────────────────
        // Header row = first row with ≥3 non-empty cells
        // Data starts on the row immediately after the header row
        const nonEmpty=r=>r.filter(c=>String(c||"").trim()!=="").length;
        let headerRowIdx=0;
        for(let i=0;i<Math.min(raw.length,30);i++){
          if(nonEmpty(raw[i])>=3){headerRowIdx=i;break;}
        }
        let firstRow=headerRowIdx+1;
        // Guard: if nothing useful follows, fall back to treating header row as data row 0
        if(firstRow>=raw.length)firstRow=headerRowIdx;

        // ── Step 1: Header-name detection (highest priority) ──────────────
        const hRow=raw[headerRowIdx];
        let hDateCol=null,hAmtCol=null,hDescCol=null;
        hRow.forEach((h,ci)=>{
          const v=String(h||"").toLowerCase().trim();
          if(hDateCol===null&&/\bdate\b/.test(v))hDateCol=ci;
          if(hAmtCol===null&&/\bamount\b|\bdebit\b|\bcredit\b|\btransaction amount\b/.test(v))hAmtCol=ci;
          if(hDescCol===null&&/\bdescription\b|\bdesc\b|\bpayee\b|\bmemo\b|\bnarrative\b/.test(v))hDescCol=ci;
        });

        // ── Step 2: Content-based scoring — only for fields not found by headers ──
        const DATE_PATTERNS=[
          /^\d{4}[-\/]\d{1,2}[-\/]\d{1,2}$/,          // YYYY-MM-DD  YYYY/MM/DD
          /^\d{1,2}[-\/]\d{1,2}[-\/]\d{2,4}$/,         // MM/DD/YYYY  DD/MM/YY
          /^\d{1,2}[-\s]\w{3}[-\s]\d{2,4}$/,           // 01-Jan-2024
          /^\w{3,9}\s+\d{1,2},?\s+\d{4}$/,             // January 1, 2024
        ];
        const EXCEL_DATE_MIN=25569; // 1970-01-01 as Excel serial
        const EXCEL_DATE_MAX=55000; // ~2050-01-01

        function isDateLike(v){
          if(v instanceof Date)return !isNaN(v.getTime());
          const s=String(v||"").trim();
          if(!s)return false;
          if(DATE_PATTERNS.some(p=>p.test(s)))return true;
          if(/\d{4}/.test(s)&&!isNaN(Date.parse(s)))return true;
          const n=Number(s);
          if(!isNaN(n)&&Number.isInteger(n)&&n>=EXCEL_DATE_MIN&&n<=EXCEL_DATE_MAX)return true;
          return false;
        }

        function isNumberLike(v){
          if(v instanceof Date)return false;
          const s=String(v||"").trim().replace(/[$,\s]/g,"");
          if(!s)return false;
          return /^-?\d+(\.\d+)?$/.test(s);
        }

        const dataRows=raw.slice(firstRow);
        const sampleRows=dataRows.slice(0,Math.min(dataRows.length,30));
        const colCount=Math.max(...raw.map(r=>r.length),0);

        // Only run content scoring for fields the header scan didn't resolve
        let bestDateCol=hDateCol,bestAmtCol=hAmtCol,bestDescCol=hDescCol;

        if(bestDateCol===null||bestAmtCol===null){
          const dateScores=Array(colCount).fill(0);
          const numScores=Array(colCount).fill(0);
          const filledCounts=Array(colCount).fill(0);

          sampleRows.forEach(row=>{
            for(let ci=0;ci<colCount;ci++){
              const v=row[ci];
              if(String(v||"").trim()==="")continue;
              filledCounts[ci]++;
              if(isDateLike(v))dateScores[ci]++;
              if(isNumberLike(v))numScores[ci]++;
            }
          });

          const dateRatio=ci=>filledCounts[ci]>0?dateScores[ci]/filledCounts[ci]:0;
          const numRatio =ci=>filledCounts[ci]>0?numScores[ci]/filledCounts[ci]:0;

          if(bestDateCol===null){
            let best=0.6;
            for(let ci=0;ci<colCount;ci++){
              const s=dateRatio(ci);if(s>best){best=s;bestDateCol=ci;}
            }
          }

          if(bestAmtCol===null){
            let best=0.7;
            for(let ci=0;ci<colCount;ci++){
              if(ci===bestDateCol)continue;
              const s=numRatio(ci);if(s>best){best=s;bestAmtCol=ci;}
            }
          }
        }

        // Description fallback: longest average text column that isn't date or amount
        if(bestDescCol===null){
          let maxAvgLen=0;
          for(let ci=0;ci<colCount;ci++){
            if(ci===bestDateCol||ci===bestAmtCol)continue;
            const avgLen=sampleRows.reduce((s,row)=>s+String(row[ci]||"").length,0)/Math.max(sampleRows.length,1);
            if(avgLen>maxAvgLen){maxAvgLen=avgLen;bestDescCol=ci;}
          }
        }

        // ── Advance firstRow to the first row with a numeric amount ──────────
        // Handles bank exports that have title rows, blank rows, or sub-headers
        // sitting between the column header and the real data.
        if(bestAmtCol!==null){
          for(let i=firstRow;i<Math.min(raw.length,firstRow+20);i++){
            if(isNumberLike(raw[i]?.[bestAmtCol])){firstRow=i;break;}
          }
        }

        setImportRawData(raw);
        setImportFirstRow(firstRow);
        setImportDateCol(bestDateCol);
        setImportAmtCol(bestAmtCol);
        setImportDescCol(bestDescCol);
        setImportStep("columns");
      }catch(err){setImportStatus({count:0,errors:-1,fileType:null});setTimeout(()=>setImportStatus(null),4000);}
    };
    reader.readAsArrayBuffer(file);
  }

  function commitImport(){
    if(importDateCol===null||importAmtCol===null||importDescCol===null||!importRawData)return;
    const selectedAccount=accounts.find(a=>a.id===importAccountId)||null;
    const acctType=selectedAccount?selectedAccount.type:importAccountType;
    const cS=v=>String(v||"").trim();
    const pA=v=>parseFloat(String(v||"").replace(/[$,\s]/g,""));
    const dataRows=importRawData.slice(importFirstRow);
    const imp=[],unmatched=[];let err=0,dup=0;
    dataRows.forEach(row=>{
      const desc=cS(row[importDescCol]);
      let amt=pA(row[importAmtCol]);
      const date=parseDate(row[importDateCol]);
      if(!desc||isNaN(amt)||amt===0){if(desc||(!isNaN(amt)&&amt!==0))err++;return;}
      // Credit card: positive charges are expenses, so negate
      if(acctType==="credit")amt=-Math.abs(amt);
      const m=matchDesc(descRules,desc,amt);
      const fA=m.type==="income"?Math.abs(amt):m.type==="expense"?-Math.abs(amt):amt;
      // Dedup check — includes _splitParent ghost records so split transactions never re-import
      if(transactions.concat(imp).some(t=>t.date===date&&Math.abs(Math.abs(t.amount)-Math.abs(fA))<0.005&&t.description===desc)){dup++;return;}
      const tx={id:Date.now()+Math.random(),description:desc,nickname:m.nickname||"",amount:fA,category:m.category,subcategory:m.subcategory,type:m.type,date,source:acctType,accountId:selectedAccount?selectedAccount.id:null,accountName:selectedAccount?selectedAccount.name:null};
      if(!m.matched)unmatched.push(tx);else imp.push(tx);
    });
    if(imp.length>0)setTransactions(prev=>imp.concat(prev));
    if(unmatched.length>0)setUnmatchedQueue(unmatched);
    setImportStatus({count:imp.length,errors:err,dupes:dup,fileType:acctType,unmatched:unmatched.length,accountName:selectedAccount?selectedAccount.name:null});
    setTimeout(()=>setImportStatus(null),6000);
    resetImport();
  }

  // ── Unmatched review ──────────────────────────────────────────────────────
  function reviewEdit(item){return reviewEdits[item.id]||{typeFilter:item.type==="notreported"?"notreported":item.type,category:item.category,subcategory:item.subcategory};}
  function setReviewEdit(item,patch){setReviewEdits(prev=>{const cur=reviewEdit(item);return{...prev,[item.id]:{...cur,...patch}};});}
  function commitReviewItem(item){
    if(reviewSplitMode){
      const total=Math.abs(item.amount);
      const sum=reviewSplits.reduce((s,sp)=>s+(parseFloat(sp.amount)||0),0);
      if(Math.abs(sum-total)>0.005)return;
      if(!reviewSplits.every(sp=>sp.category&&sp.subcategory))return;
      // Ghost the original for import dedup; all splits become new transactions
      const ghostOriginal={...item,_splitParent:true};
      delete ghostOriginal.source;
      const splitTxs=reviewSplits.map(sp=>{
        const guessType=item.amount<0?"expense":"income";
        const tax=getTaxonomyEntry(taxonomy,sp.category,sp.subcategory,guessType);
        const rt=tax.type||(item.amount<0?"expense":"income");
        const sign=rt==="income"?1:-1;
        return{id:Date.now()+Math.random(),description:item.description,nickname:item.nickname||"",date:item.date,note:item.note||"",
          accountId:item.accountId,accountName:item.accountName,source:item.source,
          amount:sign*parseFloat(sp.amount),category:sp.category,subcategory:sp.subcategory,type:rt};
      });
      setTransactions(prev=>[ghostOriginal,...splitTxs,...prev]);
      setReviewSplitMode(false);setReviewSplits([]);
      advanceReview(item.id);return;
    }
    const ed=reviewEdit(item);if(!ed.category||!ed.subcategory)return;
    const tax=getTaxonomyEntry(taxonomy,ed.category,ed.subcategory,ed.typeFilter);
    const rt=tax.type||ed.typeFilter,sign=rt==="income"?1:-1;
    const fA=rt==="notreported"?item.amount:sign*Math.abs(item.amount);
    const saved={...item,category:ed.category,subcategory:ed.subcategory,type:rt,amount:fA};
    delete saved.source;
    setTransactions(prev=>[saved,...prev]);
    if(reviewRemember){
      const sugs=generatePatternSuggestions(item.description);
      const chosen=sugs[reviewPatternIdx]?.pattern;
      if(chosen&&isSafePattern(chosen)){
        setDescRules(prev=>[...prev,{pattern:chosen,category:ed.category,subcategory:ed.subcategory,type:"auto"}]);
        showRuleToast(`✦ Rule saved: "${chosen}" → ${ed.category}`);
      }
    }
    advanceReview(item.id);
  }
  function skipReviewItem(item){advanceReview(item.id);}
  function advanceReview(doneId){
    setUnmatchedQueue(prev=>prev.filter(x=>x.id!==doneId));
    setReviewIdx(0);setReviewEdits(prev=>{const n={...prev};delete n[doneId];return n;});
    setReviewRemember(false);setReviewPatternIdx(0);
    setReviewSplitMode(false);setReviewSplits([]);
  }
  function dismissReviewQueue(){setUnmatchedQueue([]);setReviewEdits({});setReviewIdx(0);setReviewRemember(false);setReviewPatternIdx(0);setReviewSplitMode(false);setReviewSplits([]);}

  if(!loaded)return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:"#888888",fontSize:13,letterSpacing:"0.15em"}}>Loading your data…</div>;

  const monthLabel  = MONTHS[monthYear.month].slice(0,3);
  const acctLabel   = selectedAccountId===null?"All":selectedAccountId==="__unlinked__"?"Unlinked":(accounts.find(a=>a.id===selectedAccountId)?.name||"Account");
  const statsPrefix = acctLabel==="All"?"":acctLabel+" · ";
  const statsLabels = showMonthly
    ?[statsPrefix+monthLabel+" Income", statsPrefix+monthLabel+" Expenses", statsPrefix+monthLabel+" Balance"]
    :[statsPrefix+"Income", statsPrefix+"Expenses", statsPrefix+"Balance"];

  return (
    <div style={{minHeight:"100vh",padding:"16px 16px 76px"}}>
      <div style={{maxWidth:720,margin:"0 auto",paddingBottom:"calc(80px + env(safe-area-inset-bottom, 0px))"}}>

        {/* Header */}
        <div style={{marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
          <div>
            <h1 style={{fontFamily:"'Playfair Display',serif",fontSize:20,fontWeight:900,lineHeight:1,color:"#e8e0d5",whiteSpace:"nowrap"}}>Budget <span style={{color:"#606060"}}>Tracker.</span></h1>
          </div>
        </div>

        {/* Import panel — rendered as modal overlay */}
        {showImport&&(
          <div className="modal-overlay" style={{zIndex:400}} onClick={()=>{setShowImport(false);resetImport();}}>
          <div className="modal-box" style={{maxWidth:700,width:"100%",padding:0}} onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",justifyContent:"flex-end",padding:"10px 14px 0"}}>
              <button className="btn-icon" onClick={()=>{setShowImport(false);resetImport();}} style={{fontSize:18,lineHeight:1}}>×</button>
            </div>

            {/* ── Step 1: Account selection + file pick ── */}
            {importStep==="type"&&(
              <div style={{padding:20}}>
                <div className="sl">Import Bank Statement</div>
                <div style={{fontSize:12,color:"#888888",marginBottom:16,lineHeight:1.7}}>Select which account this statement belongs to, then upload the file.</div>

                {accounts.length===0?(
                  <div style={{background:"#111",border:"1px solid #2a2a2a",borderRadius:10,padding:"18px 20px",marginBottom:16,display:"flex",gap:12,alignItems:"flex-start"}}>
                    <span style={{fontSize:20}}>🏦</span>
                    <div>
                      <div style={{fontSize:12,color:"#bbbbbb",marginBottom:6}}>No accounts set up yet</div>
                      <div style={{fontSize:11,color:"#737373",lineHeight:1.6}}>Add your bank accounts first in <strong style={{color:"#999999"}}>⚙ Edit → Accounts</strong>, then come back to import.</div>
                      <button className="btn btn-secondary" style={{marginTop:10,fontSize:11,padding:"5px 14px"}} onClick={()=>{setShowImport(false);resetImport();setShowSettings(true);setEditSub("accounts");}}>Go to Accounts →</button>
                    </div>
                  </div>
                ):(
                  <div style={{marginBottom:16}}>
                    {["chequing","savings","credit"].map(type=>{
                      const meta=ACCOUNT_TYPE_META[type];
                      const typeAccounts=accounts.filter(a=>a.type===type);
                      if(typeAccounts.length===0)return null;
                      return(
                        <div key={type} style={{marginBottom:14}}>
                          <div style={{fontSize:9,color:meta.color,letterSpacing:"0.14em",textTransform:"uppercase",marginBottom:7,display:"flex",alignItems:"center",gap:6}}>
                            <span>{meta.icon}</span> {meta.label}
                          </div>
                          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                            {typeAccounts.map(acct=>{
                              const sel=importAccountId===acct.id;
                              return(
                                <button key={acct.id} onClick={()=>{setImportAccountId(acct.id);setImportAccountType(acct.type);}}
                                  style={{padding:"9px 16px",borderRadius:9,border:"1px solid "+(sel?meta.color+"88":"#242424"),background:sel?meta.color+"18":"transparent",cursor:"pointer",fontFamily:"inherit",transition:"all 0.15s",fontSize:12,color:sel?meta.color:"#999999",fontWeight:sel?600:400}}>
                                  {acct.name}
                                </button>
                              );
                            })}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}

                {/* Drop zone — only shown when an account is selected */}
                {importAccountId!==null&&(
                  <>
                    <div className="import-zone" onClick={()=>fileRef.current.click()}>
                      <div style={{fontSize:26,marginBottom:6}}>📂</div>
                      <div style={{fontSize:13,color:"#aaaaaa"}}>{'ontouchstart' in window ? "Tap to select a file" : "Click or drag & drop a file"}</div>
                      <div style={{fontSize:11,color:"#606060",marginTop:3}}>.xlsx · .xls · .csv</div>
                    </div>
                    <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" style={{display:"none"}} onChange={handleFileLoad}/>
                  </>
                )}
                {accounts.length>0&&importAccountId===null&&(
                  <div style={{fontSize:11,color:"#737373",marginTop:8}}>← Select an account above to continue</div>
                )}
              </div>
            )}

            {/* ── Step 2: Column picker + preview ── */}
            {importStep==="columns"&&importRawData&&(()=>{
              const PREVIEW_ROWS=12;
              const colCount=Math.max(...importRawData.slice(0,importFirstRow+PREVIEW_ROWS).map(r=>r.length));
              const colLetters=Array.from({length:colCount},(_,i)=>String.fromCharCode(65+i));
              const fieldColor={date:"#3b82f6",amount:"#10b981",description:"#8b5cf6"};
              const assignedFor=ci=>importDateCol===ci?"date":importAmtCol===ci?"amount":importDescCol===ci?"description":null;
              const canImport=importDateCol!==null&&importAmtCol!==null&&importDescCol!==null;
              const previewRows=importRawData.slice(0,importFirstRow+PREVIEW_ROWS);

              return(
                <div>
                  <div style={{padding:"16px 20px 12px",borderBottom:"1px solid #1e1e1e",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div>
                      <div className="sl" style={{marginBottom:2}}>Map Columns</div>
                      <div style={{fontSize:11,color:"#888888"}}>
                        {(()=>{const a=accounts.find(ac=>ac.id===importAccountId);return a?<span style={{color:ACCOUNT_TYPE_META[a.type].color}}>{a.name}</span>:<span>{importAccountType.charAt(0).toUpperCase()+importAccountType.slice(1)} statement</span>;})()}
                        {importRawData.length>0&&<span style={{color:"#5a5a5a"}}> · {importRawData.length} rows</span>}
                      </div>
                    </div>
                    <button className="btn-ghost" style={{fontSize:10}} onClick={()=>setImportStep("type")}>← Back</button>
                  </div>

                  {/* Column assignment dropdowns */}
                  <div style={{padding:"14px 20px",borderBottom:"1px solid #1e1e1e",display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
                    {[
                      {label:"Date Column",        field:"date",        val:importDateCol,        set:setImportDateCol},
                      {label:"Amount Column",       field:"amount",      val:importAmtCol,         set:setImportAmtCol},
                      {label:"Description Column",  field:"description", val:importDescCol,        set:setImportDescCol},
                    ].map(({label,field,val,set})=>(
                      <div key={field}>
                        <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:5}}>
                          <span style={{fontSize:9,color:fieldColor[field],letterSpacing:"0.12em",textTransform:"uppercase"}}>{label}</span>
                          {val!==null
                            ?<span style={{fontSize:8,background:fieldColor[field]+"22",color:fieldColor[field],borderRadius:4,padding:"1px 5px",letterSpacing:"0.06em"}}>auto</span>
                            :<span style={{fontSize:8,background:"#f9731622",color:"#f97316",borderRadius:4,padding:"1px 5px",letterSpacing:"0.06em"}}>pick one</span>
                          }
                        </div>
                        <select className="input-sm" value={val??""} onChange={e=>set(e.target.value===""?null:parseInt(e.target.value))}
                          style={{borderColor:val!==null?fieldColor[field]+"55":"#f9731655",color:val!==null?"#ddd":"#555"}}>
                          <option value="">— Pick column —</option>
                          {colLetters.map((l,ci)=><option key={ci} value={ci}>{l} — {String(importRawData[importFirstRow]?.[ci]||"").slice(0,22)||"(empty)"}</option>)}
                        </select>
                      </div>
                    ))}
                  </div>

                  {/* First data row picker */}
                  <div style={{padding:"10px 20px",borderBottom:"1px solid #1e1e1e",display:"flex",alignItems:"center",gap:12}}>
                    <span style={{fontSize:10,color:"#737373",letterSpacing:"0.08em",textTransform:"uppercase",whiteSpace:"nowrap"}}>Data starts at row</span>
                    <select className="input-sm" value={importFirstRow} onChange={e=>setImportFirstRow(parseInt(e.target.value))} style={{width:80}}>
                      {importRawData.map((_,i)=><option key={i} value={i}>{i+1}</option>)}
                    </select>
                    <span style={{fontSize:10,color:"#5a5a5a"}}>{importRawData.length-importFirstRow} transaction{importRawData.length-importFirstRow!==1?"s":""} will be read</span>
                  </div>

                  {/* Spreadsheet preview */}
                  <div style={{overflowX:"auto",maxHeight:280,overflowY:"auto"}}>
                    <table style={{borderCollapse:"collapse",fontSize:11,width:"100%",minWidth:"max-content"}}>
                      <thead style={{position:"sticky",top:0,zIndex:1}}>
                        <tr style={{background:"#111"}}>
                          <td style={{padding:"5px 8px",color:"#5a5a5a",fontSize:9,borderRight:"1px solid #1e1e1e",borderBottom:"1px solid #1e1e1e",width:32,textAlign:"center"}}>#</td>
                          {colLetters.map((l,ci)=>{
                            const assigned=assignedFor(ci);
                            return(
                              <td key={ci} style={{padding:"5px 10px",borderRight:"1px solid #1e1e1e",borderBottom:"1px solid #1e1e1e",textAlign:"center",
                                background:assigned?fieldColor[assigned]+"22":"#111",
                                color:assigned?fieldColor[assigned]:"#444",
                                fontWeight:assigned?600:400,fontSize:10,letterSpacing:"0.08em",whiteSpace:"nowrap"}}>
                                {l}{assigned&&<span style={{fontSize:8,marginLeft:4,opacity:0.8}}>{assigned==="date"?"DATE":assigned==="amount"?"AMT":"DESC"}</span>}
                              </td>
                            );
                          })}
                        </tr>
                      </thead>
                      <tbody>
                        {previewRows.map((row,ri)=>{
                          const isDataRow=ri>=importFirstRow;
                          return(
                            <tr key={ri} style={{background:ri===importFirstRow?"#1a1f1a":ri%2===0?"#0f0f0f":"transparent",borderBottom:"1px solid #141414"}}>
                              <td style={{padding:"4px 8px",color:isDataRow?"#555":"#2e2e2e",fontSize:9,borderRight:"1px solid #1e1e1e",textAlign:"center",whiteSpace:"nowrap"}}>
                                {isDataRow?<span style={{color:"#10b981",fontSize:9}}>→</span>:""} {ri+1}
                              </td>
                              {colLetters.map((_,ci)=>{
                                const assigned=assignedFor(ci);
                                const cellVal=String(row[ci]||"");
                                return(
                                  <td key={ci} style={{padding:"4px 10px",maxWidth:160,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",
                                    color:isDataRow&&assigned?fieldColor[assigned]:isDataRow?"#666":"#333",
                                    background:isDataRow&&assigned?fieldColor[assigned]+"11":"transparent",
                                    borderRight:"1px solid #141414",fontSize:isDataRow?11:10}}>
                                    {cellVal}
                                  </td>
                                );
                              })}
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>

                  {/* Import button */}
                  <div style={{padding:"14px 20px",display:"flex",gap:10,alignItems:"center"}}>
                    <button className="btn btn-primary" style={{flex:1,padding:12,opacity:canImport?1:0.4,cursor:canImport?"pointer":"not-allowed"}} onClick={canImport?commitImport:undefined}>
                      Import {importRawData.length-importFirstRow} Rows
                    </button>
                    {!canImport&&<span style={{fontSize:11,color:"#888888"}}>Assign all three columns above to continue</span>}
                  </div>
                </div>
              );
            })()}

          </div>
          </div>
        )}

        {/* Add form */}
        {showForm&&(
          <div className="card fade-in" style={{padding:20,marginBottom:20}}>
            <div className="sl">New Transaction</div>
            <div style={{display:"grid",gap:10}}>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                {["expense","income","notreported"].map(tf=>(
                  <button key={tf} className={"btn chip "+(form.typeFilter===tf?"chip-active":"chip-inactive")} onClick={()=>handleTFChange(tf)} style={{fontSize:11}}>
                    {tf==="notreported"?"Not Reported":tf[0].toUpperCase()+tf.slice(1)}
                  </button>
                ))}
              </div>
              <input className="input" placeholder="Description" ref={descriptionRef} value={form.description} onChange={e=>{setDupWarning(false);setForm(f=>({...f,description:e.target.value}));}} onKeyDown={e=>{if(e.key==="Enter")addTransaction();}}/>
              <div className="grid-2">

                    <div style={{fontSize:"clamp(11px,2vw,17px)",fontWeight:500,color:"#f43f5e"}}>{fmt(monthlyStats.expenses)}</div>
                  </div>
                  <div className="stat-card"><div style={{fontSize:10,letterSpacing:"0.12em",color:"#737373",textTransform:"uppercase",marginBottom:5}}>{savRate!==null?"Savings Rate":"Net"}</div><div style={{fontSize:"clamp(11px,2vw,17px)",fontWeight:500,color:net>=0?"#10b981":"#f43f5e"}}>{savRate!==null?savRate.toFixed(1)+"%":fmt(net)}</div></div>
                </div>
              );
            })()}
            {monthlyTx.filter(t=>t.type==="expense").length>0&&(
              <div className="card" style={{padding:20,marginBottom:16}}>
                <div className="sl">Cumulative Expenses — {MONTHS[monthYear.month]} {monthYear.year}</div>
                <LineChart transactions={monthlyTx} allTransactions={viewTx} month={monthYear.month} year={monthYear.year} taxonomy={taxonomy}/>
              </div>
            )}
            {monthlyTx.length===0&&(
              <div className="card fade-in" style={{padding:"40px 28px",marginBottom:16,textAlign:"center"}}>
                <div style={{fontSize:28,marginBottom:12}}>📭</div>
                <div style={{fontSize:14,color:"#999",marginBottom:6,fontWeight:500}}>{MONTHS[monthYear.month]} {monthYear.year} has no transactions</div>
                <div style={{fontSize:12,color:"#555",marginBottom:20,lineHeight:1.7}}>
                  Import a bank statement or add transactions manually<br/>to start tracking this month.
                </div>
                <div style={{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}}>
                  <button className="btn btn-primary" style={{padding:"9px 20px",fontSize:12}} onClick={()=>{setShowAddMenu(false);setTimeout(()=>{setShowImport(true);resetImport();},50);}}>↑ Import Statement</button>
                  <button className="btn btn-secondary" style={{padding:"9px 20px",fontSize:12}} onClick={()=>setTimeout(()=>setShowForm(true),50)}>+ Add Manually</button>
                </div>
              </div>
            )}
            {(Object.keys(monthlyStats.byCat).length>0||Object.keys(monthlyStats.byIncomeCat).length>0)&&(
              <div className="card" style={{padding:20,marginBottom:16}}>
                <div style={{display:"flex",gap:32,flexWrap:"wrap"}}>
                  {Object.keys(monthlyStats.byCat).length>0&&(
                    <div style={{flex:"1 1 260px"}}>
                      <div className="sl">Expenses by Category</div>
                      <PieChart byCat={monthlyStats.byCat} totalSpend={monthlyStats.expenses}/>
                    </div>
                  )}
                  {Object.keys(monthlyStats.byIncomeCat).length>0&&(
                    <div style={{flex:"1 1 260px"}}>
                      <div className="sl">Income by Category</div>
                      <PieChart byCat={monthlyStats.byIncomeCat} totalSpend={monthlyStats.income}/>
                    </div>
                  )}
                </div>

              </div>
            )}
          </div>
        )}

        {/* Categories tab: month selector */}
        {activeTab==="categories"&&(
          <div className="card fade-in" style={{padding:"14px 20px",marginBottom:16,display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12}}>
            <button className="btn-icon" onClick={()=>shiftMonth(-1)}>←</button>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <select className="month-select" value={monthYear.month} onChange={e=>setMonthYear(mv=>({...mv,month:parseInt(e.target.value)}))}>
                {MONTHS.map((m,i)=><option key={i} value={i}>{m}</option>)}
              </select>
              <select className="month-select" value={monthYear.year} onChange={e=>setMonthYear(mv=>({...mv,year:parseInt(e.target.value)}))}>
                {availableYears.map(y=><option key={y} value={y}>{y}</option>)}
              </select>
            </div>
            <button className="btn-icon" onClick={()=>shiftMonth(1)}>→</button>
          </div>
        )}

        {/* ── CATEGORIES: Budget section ── */}
        {activeTab==="categories"&&(()=>{
          // Build per-category budget map from taxonomy (expense entries only)
          const budgetMap={};
          taxonomy.filter(t=>t.type==="expense"||t.type==="notreported").forEach(t=>{
            if(!budgetMap[t.category])budgetMap[t.category]={budget:0,subs:{}};
            budgetMap[t.category].budget+=(t.budget||0);
            budgetMap[t.category].subs[t.subcategory]=(budgetMap[t.category].subs[t.subcategory]||0)+(t.budget||0);
          });

          // Collect spend per subcategory per month-key, for all months strictly before selected
          const spendBySubByMonth={}; // { "cat::sub": { "YYYY-MM": amount } }
          // Also track which month-keys existed in the transaction history before selected month
          const pastMonthKeys=new Set();
          viewTx.forEach(t=>{
            if(t.type!=="expense")return;
            const d=new Date(t.date+"T00:00:00");
            const tY=d.getFullYear(),tM=d.getMonth();
            if(tY>monthYear.year||(tY===monthYear.year&&tM>=monthYear.month))return;
            const mk=tY+"-"+String(tM+1).padStart(2,"0");
            pastMonthKeys.add(mk);
            const k=t.category+"::"+t.subcategory;
            if(!spendBySubByMonth[k])spendBySubByMonth[k]={};
            spendBySubByMonth[k][mk]=(spendBySubByMonth[k][mk]||0)+Math.abs(t.amount);
          });

          // Effective budget per subcategory = base + accumulated rollover across all past months
          function effectiveSubBudget(cat,sub){
            const base=budgetMap[cat]?.subs[sub]||0;
            const key=cat+"::"+sub;
            if(!rolloverSubs.has(key)||base===0)return{effective:base,rollover:0,base};
            const mode=rolloverMode.get(key)||"surplus";
            const monthSpend=spendBySubByMonth[key]||{};
            let accumulated=0;
            // Iterate every past month that had any transactions
            pastMonthKeys.forEach(mk=>{
              const spent=monthSpend[mk]||0;
              const delta=mode==="net"?(base-spent):Math.max(0,base-spent);
              accumulated+=delta;
            });
            return{effective:Math.max(0,base+accumulated),rollover:accumulated,base};
          }

          // Effective budget per category = sum of effective sub budgets
          function effectiveCatBudget(cat){
            const subs=Object.keys(budgetMap[cat]?.subs||{});
            let eff=0,rol=0,base=0;
            subs.forEach(sub=>{const r=effectiveSubBudget(cat,sub);eff+=r.effective;rol+=r.rollover;base+=r.base;});
            return{effective:eff,rollover:rol,base};
          }

          const totalBudget=Object.values(budgetMap).reduce((s,c)=>s+c.budget,0);

          // Actuals for selected month
          const actualByCat=monthlyStats.byCat; // {cat:{total,subs:{sub:amt}}}
          const totalSpent=monthlyStats.expenses;

          // All cats that either have a budget or have spending this month
          const allCatKeys=new Set([...Object.keys(budgetMap),...Object.keys(actualByCat)]);
          const budgetedCats=[],unbudgetedCats=[];
          allCatKeys.forEach(cat=>{
            const bud=(budgetMap[cat]?.budget||0);
            if(bud>0)budgetedCats.push(cat);else unbudgetedCats.push(cat);
          });
          budgetedCats.sort((a,b)=>(budgetMap[b]?.budget||0)-(budgetMap[a]?.budget||0));
          unbudgetedCats.sort((a,b)=>(actualByCat[b]?.total||0)-(actualByCat[a]?.total||0));

          function BudgetRow({cat,showAll}){
            const {effective:bud,rollover:catRollover,base:baseBud}=effectiveCatBudget(cat);
            const spent=actualByCat[cat]?.total||0;
            const pct=bud>0?Math.min(spent/bud*100,100):0;
            const over=bud>0&&spent>bud;
            const barColor=over?"#f43f5e":pct>80?"#f97316":catColor(cat);
            const util=bud>0?(spent/bud*100):null;
            const allSubKeys=new Set([
              ...Object.keys(budgetMap[cat]?.subs||{}),
              ...Object.keys(actualByCat[cat]?.subs||{}),
            ]);
            const subKeys=[...( showAll?allSubKeys:new Set([...allSubKeys].filter(s=>(budgetMap[cat]?.subs[s]||0)>0||(actualByCat[cat]?.subs[s]||0)>0)) )].sort();
            const budgetedSubKeys=subKeys.filter(s=>(budgetMap[cat]?.subs[s]||0)>0&&cat!=="Not Assigned");
            const allSubsRolling=budgetedSubKeys.length>0&&budgetedSubKeys.every(s=>rolloverSubs.has(cat+"::"+s));
            const anySubRolling=budgetedSubKeys.some(s=>rolloverSubs.has(cat+"::"+s));
            return(
              <div style={{marginBottom:20}}>
                {/* Category header row */}
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6,gap:8}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                    <div style={{width:8,height:8,borderRadius:"50%",background:catColor(cat),flexShrink:0}}/>
                    <span style={{fontSize:13,fontWeight:500,color:"#ccc"}}>{cat}</span>
                    {util!==null&&(
                      <span style={{fontSize:10,borderRadius:100,padding:"1px 7px",background:"#1e1e1e",color:over?"#f43f5e":pct>80?"#f97316":"#555"}}>
                        {util.toFixed(0)}%
                      </span>
                    )}
                    {over&&<span style={{fontSize:10,fontWeight:700,color:"#f43f5e",padding:"1px 5px",borderRadius:100,background:"#f43f5e18"}}>!</span>}
                    {baseBud===0&&spent>0&&<span style={{fontSize:10,color:"#737373",background:"#1a1a1a",borderRadius:100,padding:"1px 7px"}}>no budget</span>}
                    {/* Toggle-all button */}
                    {budgetedSubKeys.length>0&&(
                      <button type="button" onMouseDown={e=>e.preventDefault()}
                        onClick={()=>toggleRolloverAllSubs(cat,budgetedSubKeys)}
                        title={allSubsRolling?"Disable rollover for all subcategories":"Enable rollover for all subcategories"}
                        style={{fontSize:9,padding:"2px 8px",border:"1px solid "+(anySubRolling?"#10b98155":"#2a2a2a"),borderRadius:4,
                          background:anySubRolling?"#10b98112":"transparent",color:anySubRolling?"#10b981":"#555",
                          cursor:"pointer",fontFamily:"inherit",letterSpacing:"0.06em",textTransform:"uppercase",transition:"all 0.15s",flexShrink:0}}>
                        ↻ {allSubsRolling?"all on":anySubRolling?"partial":"all off"}
                      </button>
                    )}
                  </div>
                  <div style={{textAlign:"right",flexShrink:0}}>
                    <div style={{fontSize:13,color:over?"#f43f5e":"#888"}}>{fmt(spent)}</div>
                    {anySubRolling&&baseBud>0&&catRollover!==0&&(
                      <div style={{fontSize:10,color:"#555",marginTop:3,display:"flex",alignItems:"center",gap:4,justifyContent:"flex-end",flexWrap:"wrap"}}>
                        <span style={{color:"#4a4a4a"}}>{fmt(baseBud)}</span>
                        <span style={{color:catRollover>0?"#10b981":"#f43f5e",fontWeight:500}}>{catRollover>0?"+":"−"}{fmt(Math.abs(catRollover))}</span>
                        <span style={{color:"#3a3a3a"}}>=</span>
                        <span style={{color:"#666"}}>{fmt(bud)}</span>
                      </div>
                    )}
                  </div>
                </div>
                {bud>0&&(
                  <div style={{background:"#1a1a1a",borderRadius:4,height:6,marginBottom:10,position:"relative",overflow:"hidden"}}>
                    {anySubRolling&&catRollover!==0&&<div style={{position:"absolute",left:0,top:0,bottom:0,width:(baseBud/bud*100)+"%",background:barColor,opacity:0.3,borderRadius:4}}/>}
                    <div style={{position:"absolute",left:0,top:0,bottom:0,width:pct+"%",background:barColor,borderRadius:4,transition:"width 0.5s ease"}}/>
                    {anySubRolling&&catRollover>0&&<div style={{position:"absolute",left:(baseBud/bud*100)+"%",top:0,bottom:0,width:1,background:"#10b98166"}}/>}
                    {over&&<div style={{position:"absolute",inset:0,borderRadius:4,border:"1px solid #f43f5e55"}}/>}
                  </div>
                )}
                {subKeys.map(sub=>{
                  const sBud=(budgetMap[cat]?.subs[sub]||0);
                  const sSpent=(actualByCat[cat]?.subs[sub]||0);
                  const subKey=cat+"::"+sub;
                  const {effective:sEff,rollover:sRollover}=effectiveSubBudget(cat,sub);
                  const sPct=sEff>0?Math.min(sSpent/sEff*100,100):0;
                  const sOver=sEff>0&&sSpent>sEff;
                  const eKey=subKey;
                  const isEditing=editingBudgetKey===eKey;
                  const isSubRollover=rolloverSubs.has(subKey);
                  const subMode=rolloverMode.get(subKey)||"surplus";
                  function handleBudgetCommit(e){commitInlineBudget(cat,sub,e.target.value);}
                  function handleBudgetKeyDown(e){if(e.key==="Enter"){e.target.blur();}if(e.key==="Escape"){setEditingBudgetKey(null);}}
                  return(
                    <div key={sub} style={{padding:"6px 0 6px 16px",borderLeft:"1px solid "+catColor(cat)+"30",marginBottom:4}}>
                      {/* Sub name row + rollover controls */}
                      <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:sBud>0?4:0,flexWrap:"wrap"}}>
                        <div style={{flex:1,fontSize:11,color:"#888888",minWidth:60}}>{sub}</div>
                        {/* Rollover controls — only for budgeted subs */}
                        {sBud>0&&cat!=="Not Assigned"&&(
                          <>
                            <button type="button" onMouseDown={e=>e.preventDefault()}
                              onClick={()=>toggleRolloverSub(subKey)}
                              style={{fontSize:9,padding:"1px 6px",border:"1px solid "+(isSubRollover?"#10b98155":"#252525"),borderRadius:4,
                                background:isSubRollover?"#10b98112":"transparent",color:isSubRollover?"#10b981":"#4a4a4a",
                                cursor:"pointer",fontFamily:"inherit",letterSpacing:"0.05em",transition:"all 0.15s",flexShrink:0}}>
                              ↻ {isSubRollover?"on":"off"}
                            </button>
                            {isSubRollover&&(
                              <>
                                <button type="button" onMouseDown={e=>e.preventDefault()}
                                  onClick={()=>setRolloverModeForSub(subKey,"surplus")}
                                  title="Carry forward only unspent surplus"
                                  style={{fontSize:9,padding:"1px 6px",border:"1px solid "+(subMode==="surplus"?"#10b98155":"#252525"),borderRadius:4,
                                    background:subMode==="surplus"?"#10b98112":"transparent",color:subMode==="surplus"?"#10b981":"#4a4a4a",
                                    cursor:"pointer",fontFamily:"inherit",transition:"all 0.15s",flexShrink:0}}>
                                  + only
                                </button>
                                <button type="button" onMouseDown={e=>e.preventDefault()}
                                  onClick={()=>setRolloverModeForSub(subKey,"net")}
                                  title="Carry forward net difference (overspend reduces next month)"
                                  style={{fontSize:9,padding:"1px 6px",border:"1px solid "+(subMode==="net"?"#10b98155":"#252525"),borderRadius:4,
                                    background:subMode==="net"?"#10b98112":"transparent",color:subMode==="net"?"#10b981":"#4a4a4a",
                                    cursor:"pointer",fontFamily:"inherit",transition:"all 0.15s",flexShrink:0}}>
                                  +/−
                                </button>
                              </>
                            )}
                          </>
                        )}
                        {/* Amounts */}
                        <div style={{fontSize:11,textAlign:"right",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"flex-end",gap:4,minWidth:80}}>
                          {isEditing?(
                            <input type="number" className="input-sm" defaultValue={sBud||""} placeholder="0.00" autoFocus
                              onBlur={handleBudgetCommit} onKeyDown={handleBudgetKeyDown}
                              style={{width:80,textAlign:"right",fontSize:11}}/>
                          ):(
                            <>
                              <span style={{color:sOver?"#f43f5e":"#555555"}}>{fmt(sSpent)}</span>
                              {sBud>0&&<span style={{color:"#444444",marginLeft:2}}>/ </span>}
                              <span onClick={()=>setEditingBudgetKey(eKey)} title="Click to edit budget"
                                style={{color:sBud>0?"#555555":"#3a3a3a",cursor:"pointer",borderBottom:"1px dashed #333",paddingBottom:1,fontSize:sBud>0?11:10,whiteSpace:"nowrap"}}>
                                {sBud>0?fmt(sBud):"+ set budget"}
                              </span>
                            </>
                          )}
                        </div>
                      </div>
                      {/* Sub progress bar + rollover formula */}
                      {sBud>0&&!isEditing&&(
                        <div>
                          <div style={{background:"#1a1a1a",borderRadius:3,height:3,marginBottom:isSubRollover&&sRollover!==0?3:0,position:"relative",overflow:"hidden"}}>
                            {isSubRollover&&sRollover!==0&&<div style={{position:"absolute",left:0,top:0,bottom:0,width:(sBud/sEff*100)+"%",background:sOver?"#f43f5e":sPct>80?"#f97316":catColor(cat),opacity:0.3,borderRadius:3}}/>}
                            <div style={{width:sPct+"%",height:"100%",borderRadius:3,background:sOver?"#f43f5e":sPct>80?"#f97316":catColor(cat),transition:"width 0.4s ease"}}/>
                            {isSubRollover&&sRollover>0&&<div style={{position:"absolute",left:(sBud/sEff*100)+"%",top:0,bottom:0,width:1,background:"#10b98166"}}/>}
                          </div>
                          {isSubRollover&&sRollover!==0&&(
                            <div style={{display:"flex",alignItems:"center",gap:4,fontSize:9,color:"#3a3a3a",justifyContent:"flex-end"}}>
                              <span>{fmt(sBud)}</span>
                              <span style={{color:sRollover>0?"#10b981":"#f43f5e"}}>{sRollover>0?"+":"−"}{fmt(Math.abs(sRollover))}</span>
                              <span>=</span>
                              <span style={{color:"#555"}}>{fmt(sEff)}</span>
                            </div>
                          )}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            );
          }

          const totalRollover=budgetedCats.reduce((s,cat)=>s+effectiveCatBudget(cat).rollover,0);
          const totalEffectiveBudget=budgetedCats.reduce((s,cat)=>s+effectiveCatBudget(cat).effective,0);
          const remaining=totalEffectiveBudget-totalSpent;

          return(
            <div className="fade-in">
              {/* Overall progress bar */}
              {totalBudget>0&&(
                <div className="card" style={{padding:"16px 20px",marginBottom:16}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                    <div style={{fontSize:10,letterSpacing:"0.14em",color:"#737373",textTransform:"uppercase"}}>Overall Budget Usage</div>
                    <div style={{fontSize:12,color:totalSpent>totalEffectiveBudget?"#f43f5e":"#666"}}>
                      {totalEffectiveBudget>0?((totalSpent/totalEffectiveBudget)*100).toFixed(1):0}%
                    </div>
                  </div>
                  <div style={{background:"#1a1a1a",borderRadius:6,height:10,position:"relative",overflow:"hidden"}}>
                    <div style={{width:(Math.min(totalSpent/totalEffectiveBudget,1)*100)+"%",height:"100%",borderRadius:6,
                      background:totalSpent>totalEffectiveBudget?"#f43f5e":totalSpent/totalEffectiveBudget>0.8?"#f97316":"#10b981",
                      transition:"width 0.6s ease"}}/>
                  </div>
                  {/* Budget + rollover totals */}
                  <div style={{display:"flex",gap:16,marginTop:12,flexWrap:"wrap"}}>
                    <div>
                      <div style={{fontSize:9,letterSpacing:"0.12em",color:"#555",textTransform:"uppercase",marginBottom:3}}>Base Budget</div>
                      <div style={{fontSize:13,color:"#888"}}>{fmt(totalBudget)}</div>
                    </div>
                    {totalRollover!==0&&(
                      <div>
                        <div style={{fontSize:9,letterSpacing:"0.12em",color:"#555",textTransform:"uppercase",marginBottom:3}}>Rollover</div>
                        <div style={{fontSize:13,color:totalRollover>0?"#10b981":"#f43f5e",fontWeight:500}}>
                          {totalRollover>0?"+":"−"}{fmt(Math.abs(totalRollover))}
                        </div>
                      </div>
                    )}
                    {totalRollover!==0&&(
                      <div>
                        <div style={{fontSize:9,letterSpacing:"0.12em",color:"#555",textTransform:"uppercase",marginBottom:3}}>Effective</div>
                        <div style={{fontSize:13,color:"#aaa"}}>{fmt(totalEffectiveBudget)}</div>
                      </div>
                    )}
                    <div style={{marginLeft:"auto",textAlign:"right"}}>
                      <div style={{fontSize:9,letterSpacing:"0.12em",color:"#555",textTransform:"uppercase",marginBottom:3}}>Spent</div>
                      <div style={{fontSize:13,color:totalSpent>totalEffectiveBudget?"#f43f5e":"#888"}}>{fmt(totalSpent)}</div>
                    </div>
                  </div>
                  {totalSpent>totalEffectiveBudget&&(
                    <div style={{fontSize:11,color:"#f43f5e",marginTop:10}}>⚠ Over budget by {fmt(totalSpent-totalEffectiveBudget)}</div>
                  )}
                </div>
              )}

              {/* No budgets set at all */}
              {totalBudget===0&&(
                <div className="card" style={{padding:"28px 24px",marginBottom:16,textAlign:"center"}}>
                  <div style={{fontSize:22,marginBottom:10}}>📋</div>
                  <div style={{fontSize:13,color:"#999999",marginBottom:12,lineHeight:1.7}}>No budgets have been set yet.<br/>Add budget amounts to your categories to track spending here.</div>
                  <button className="btn btn-secondary" style={{padding:"8px 20px",fontSize:12}} onClick={()=>{setShowSettings(true);setEditSub("categories");}}>Set Budgets in Categories →</button>
                </div>
              )}

              {/* Budgeted categories */}
              {(budgetedCats.length>0||unbudgetedCats.filter(c=>actualByCat[c]?.total>0).length>0)&&(
                <div className="card" style={{padding:"18px 20px",marginBottom:16}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
                    <div style={{display:"flex",alignItems:"center",gap:10}}>
                      <div className="sl" style={{marginBottom:0}}>Categories</div>

                    </div>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <button className={"btn chip-sm "+(showAllBudgetCats?"chip-active":"chip-inactive")}
                        style={{fontSize:10,padding:"3px 10px"}}
                        onClick={()=>setShowAllBudgetCats(v=>!v)}>
                        {showAllBudgetCats?"Budgeted only":"Show all"}
                      </button>
                      <button className="btn-ghost" style={{fontSize:10,padding:"3px 10px"}} onClick={()=>{setShowSettings(true);setEditSub("categories");}}>Edit budgets →</button>
                    </div>
                  </div>
                  {budgetedCats.map(cat=><BudgetRow key={cat} cat={cat} showAll={showAllBudgetCats}/>)}
                  {unbudgetedCats.filter(c=>actualByCat[c]?.total>0).length>0&&(
                    <div style={{marginTop:budgetedCats.length>0?16:0}}>
                      {budgetedCats.length>0&&<div style={{borderTop:"1px solid #1e1e1e",marginBottom:16}}/>}
                      <div style={{fontSize:9,letterSpacing:"0.14em",color:"#737373",textTransform:"uppercase",marginBottom:12}}>No Budget Set</div>
                      {unbudgetedCats.filter(c=>actualByCat[c]?.total>0).map(cat=><BudgetRow key={cat} cat={cat} showAll={true}/>)}
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })()}

        {/* ── SETTINGS TAB ── */}
        {activeTab==="settings"&&(
          <div className="fade-in">
            <div style={{display:"flex",gap:6,marginBottom:16,flexWrap:"wrap"}}>
              <button className={"subtab "+(editSub==="accounts"?"subtab-active":"subtab-inactive")} onClick={()=>setEditSub("accounts")}>Accounts</button>
              <button className={"subtab "+(editSub==="categories"?"subtab-active":"subtab-inactive")} onClick={()=>setEditSub("categories")}>Categories &amp; Subcategories</button>
              <button className={"subtab "+(editSub==="rules"?"subtab-active":"subtab-inactive")} onClick={()=>setEditSub("rules")}>Description Rules</button>
              <button className={"subtab "+(editSub==="data"?"subtab-active":"subtab-inactive")} onClick={()=>setEditSub("data")}>Data &amp; Backup</button>
            </div>

            {editSub==="accounts"&&(

                {editSplitMode&&(
                  <div style={{background:"#111",border:"1px solid #1e1e1e",borderRadius:8,padding:"12px 14px"}}>
                    <SplitEditor total={parseFloat(editForm.amount)||0} splits={editSplits} onChange={setEditSplits}
                      taxonomy={taxonomy} cats={editCats} typeFilter={editForm.typeFilter}/>
                  </div>
                )}
                <div>
                  <div style={{fontSize:9,letterSpacing:"0.12em",color:"#737373",textTransform:"uppercase",marginBottom:6}}>Note</div>
                  <input className="input" placeholder="Optional note…" value={editForm.note||""} onChange={e=>setEditForm(f=>({...f,note:e.target.value}))} onKeyDown={e=>{if(e.key==="Enter"&&!editSplitMode)commitEditTx();}}/>
                </div>
                {accounts.length>0&&(
                  <div>
                    <div style={{fontSize:9,letterSpacing:"0.12em",color:"#737373",textTransform:"uppercase",marginBottom:8}}>Account</div>
                    <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                      <button onClick={()=>setEditForm(f=>({...f,accountId:null}))}
                        style={{padding:"5px 12px",borderRadius:100,border:"1px solid "+(editForm.accountId===null?"#888":"#242424"),background:editForm.accountId===null?"#1e1e1e":"transparent",color:editForm.accountId===null?"#ccc":"#555",fontSize:11,cursor:"pointer",fontFamily:"inherit",transition:"all 0.15s"}}>
                        None
                      </button>
                      {["chequing","savings","credit"].flatMap(type=>
                        accounts.filter(a=>a.type===type).map(a=>{
                          const meta=ACCOUNT_TYPE_META[type];
                          const sel=editForm.accountId===a.id;
                          return(
                            <button key={a.id} onClick={()=>setEditForm(f=>({...f,accountId:a.id}))}
                              style={{padding:"5px 12px",borderRadius:100,border:"1px solid "+(sel?meta.color+"88":"#242424"),background:sel?meta.color+"18":"transparent",color:sel?meta.color:"#888888",fontSize:11,cursor:"pointer",fontFamily:"inherit",fontWeight:sel?600:400,transition:"all 0.15s"}}>
                              {meta.icon} {a.name}
                            </button>
                          );
                        })
                      )}
                    </div>
                    {!editForm.accountId&&<div style={{fontSize:10,color:"#f97316",marginTop:6}}>⚠ No account linked — this transaction will appear under "Not Linked"</div>}
                  </div>
                )}
                <div style={{display:"flex",gap:10,marginTop:2}}>
                  <button className="btn btn-primary" style={{flex:1,padding:12,opacity:canSave?1:0.4,cursor:canSave?"pointer":"not-allowed"}} onClick={commitEditTx}>Save Changes</button>
                  <button className="btn-secondary" style={{padding:"10px 14px",fontSize:11,whiteSpace:"nowrap"}} title="Create an auto-categorization rule from this transaction" onClick={()=>{closeEditTx();openCreateRule(editingTx);}}>✦ Rule</button>
                  <button className="btn-reset" style={{padding:"10px 16px",color:"#f43f5e",borderColor:"#f43f5e22",fontSize:11}} onClick={deleteEditTx}>Delete</button>
                </div>
              </div>
            </div>
          </div>
        );
      })()}


      {/* ── WELCOME OVERLAY ── */}
      {isNewUser&&loaded&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.88)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:2000,padding:16}}>
          <div style={{background:"#141414",border:"1px solid #2a2a2a",borderRadius:18,width:"100%",maxWidth:400,padding:"44px 36px 40px",textAlign:"center",boxShadow:"0 32px 80px rgba(0,0,0,0.8)"}}>
            <div style={{fontSize:32,marginBottom:16}}>💰</div>
            <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:26,fontWeight:900,color:"#e8e0d5",marginBottom:10,lineHeight:1.2}}>Welcome to<br/>Budget Tracker</h2>
            <p style={{fontSize:13,color:"#888888",lineHeight:1.8,marginBottom:32}}>Track your income and expenses and understand where your money goes.</p>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              <button className="btn btn-primary" style={{padding:14,fontSize:14}} onClick={()=>{obFinish();setTimeout(()=>{setShowImport(true);resetImport();},50);}}>↑ Import a Bank Statement</button>
              <button className="btn btn-secondary" style={{padding:12,fontSize:13}} onClick={()=>{obFinish();setTimeout(()=>setShowForm(true),50);}}>+ Add a Transaction Manually</button>
              <button className="btn-ghost" style={{fontSize:11,color:"#5a5a5a",marginTop:4}} onClick={obFinish}>Explore first</button>
            </div>
          </div>
        </div>
      )}
      {createRuleTx&&(
        <CreateRuleModal tx={createRuleTx} taxonomy={taxonomy} onSave={saveCreatedRule} onCancel={()=>setCreateRuleTx(null)}/>
      )}
      {quickAddTaxCtx&&(
        <QuickAddTaxModal
          typeHint={quickAddTaxCtx.typeHint}
          taxonomy={taxonomy}
          allCats={allCats}
          onAdd={entry=>{
            addTaxEntryDirect(entry);
            quickAddTaxCtx.onAdded(entry);
            setQuickAddTaxCtx(null);
          }}
          onCancel={()=>setQuickAddTaxCtx(null)}/>
      )}
      {editingRuleIdx!==null&&(
        <EditRuleModal rule={editingRuleVal} taxonomy={taxonomy}
          onSave={rule=>{setDescRules(prev=>prev.map((r,i)=>i===editingRuleIdx?rule:r));setEditingRuleIdx(null);setEditingRuleVal({});}}
          onCancel={()=>{setEditingRuleIdx(null);setEditingRuleVal({});}}/>
      )}

      {/* Confirm Modal */}
      {confirmModal&&(
        <ConfirmModal message={confirmModal.message} detail={confirmModal.detail} confirmLabel={confirmModal.confirmLabel} danger={confirmModal.danger} onConfirm={()=>{confirmModal.onConfirm();setConfirmModal(null);}} onCancel={()=>setConfirmModal(null)}/>
      )}

      {/* Add Menu modal */}
      {showAddMenu&&!showForm&&!showImport&&(
        <div className="modal-overlay" style={{zIndex:400}} onClick={()=>setShowAddMenu(false)}>
          <div className="modal-box" style={{maxWidth:400,width:"100%"}} onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>
              <span style={{fontWeight:700,fontSize:13,letterSpacing:"0.08em",color:"#888"}}>ADD TRANSACTION</span>
              <button className="btn-icon" onClick={()=>setShowAddMenu(false)} style={{fontSize:18,lineHeight:1}}>×</button>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              <button className="btn btn-primary" style={{padding:"16px 20px",fontSize:14,textAlign:"left",borderRadius:10}} onClick={()=>{setShowForm(true);setShowAddMenu(false);}}>✎ &nbsp;&nbsp;Manual Entry</button>
              <button className="btn btn-secondary" style={{padding:"16px 20px",fontSize:14,textAlign:"left",borderRadius:10}} onClick={()=>{resetImport();setShowImport(true);setShowAddMenu(false);}}>↑ &nbsp;&nbsp;Import File</button>
            </div>
          </div>
        </div>
      )}

      {/* Navigation Footer */}
      <nav className="nav-footer">
        <button className={"nav-item"+(activeTab==="transactions"?" nav-active":"")} onClick={()=>setActiveTab("transactions")}>
          <span className="nav-icon">☰</span>
          <span className="nav-label">Transactions</span>
        </button>
        <button className={"nav-item"+(activeTab==="summary"?" nav-active":"")} onClick={()=>setActiveTab("summary")}>
          <span className="nav-icon">◎</span>
          <span className="nav-label">Summary</span>
        </button>
        <button className="nav-item nav-add" onClick={()=>{if(showForm||showImport){setShowForm(false);setShowImport(false);resetImport();setAmountError("");}else{setShowAddMenu(v=>!v);}}}>
          <span className="nav-icon" style={{fontSize:22,fontWeight:300}}>{(showForm||showImport||showAddMenu)?"×":"+"}</span>
          <span className="nav-label">Add</span>
        </button>
        <button className={"nav-item"+(activeTab==="categories"?" nav-active":"")} onClick={()=>setActiveTab("categories")}>
          <span className="nav-icon">⊞</span>
          <span className="nav-label">Categories</span>
        </button>
        <button className={"nav-item"+(activeTab==="settings"?" nav-active":"")} onClick={()=>setActiveTab("settings")}>
          <span className="nav-icon">⚙</span>
          <span className="nav-label">Settings</span>
        </button>
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
